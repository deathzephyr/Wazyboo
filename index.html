<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wazyboo — Treine seu raciocínio lógico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   WAZYBOO — marca ROXA · temas branco/preto · layout PC + celular
   Trilha única sequencial, sem fases repetitivas · v1.8
   ============================================================ */
:root{
  --p1:#8B5CF6; --p2:#6D28D9; --p3:#A78BFA;
  --y1:#FFC800; --y2:#DBA800;
  --r1:#FF4B4B; --r2:#E13C3C;
  --bg:#FFFFFF; --card:#FFFFFF; --bg2:#F7F7F7;
  --line:#E5E5E5; --line2:#CFCFCF;
  --ink:#3C3C3C; --ink2:#777; --faint:#AFAFAF;
  --hover:#F6F1FF;
  --sel:#EDE4FF; --selB:#C4A5F5; --selT:#7C3AED;
  --accBg:#EDE4FF; --accB:#B98EF5; --accT:#6D28D9;
  --badBg:#FFE3E5; --badB:#FFB2B2; --badT:#D63333;
  --goldBg:#FFF8E1; --goldT:#9A7400;
  --fire:#FF9600; --hpill:#FF5A5A; --coin:#1CB0F6;
}
html[data-theme="dark"]{
  --bg:#131318; --card:#1D1D24; --bg2:#26262E;
  --line:#33333D; --line2:#45454F;
  --ink:#F1F1F4; --ink2:#B0B0BA; --faint:#7A7A85;
  --hover:#2A2440;
  --sel:#2E2650; --selB:#6D4FD1; --selT:#B79CFF;
  --accBg:#2E2650; --accB:#7C5CC4; --accT:#C9B0FF;
  --badBg:#3A1D22; --badB:#8A4048; --badT:#FF8A8A;
  --goldBg:#383014; --goldT:#E8C558;
  --fire:#FFB020; --hpill:#FF7B7B; --coin:#4CC3FF;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Nunito',sans-serif;color:var(--ink);background:var(--bg);min-height:100dvh;transition:background .25s,color .25s}
button{font-family:'Nunito',sans-serif;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:'Nunito',sans-serif}
svg{display:block}
.sym{display:inline-block;vertical-align:middle}

/* ============ Estrutura: sidebar | conteúdo | rail ============ */
#layout{display:flex;max-width:1240px;margin:0 auto}
#sidebar{display:none;width:250px;flex:none;position:sticky;top:0;height:100dvh;
  padding:22px 14px;flex-direction:column;gap:6px;border-right:2px solid var(--line)}
#mainCol{flex:1;min-width:0}
#rail{display:none;width:320px;flex:none;position:sticky;top:0;height:100dvh;
  padding:22px 16px;gap:12px;flex-direction:column;overflow-y:auto;border-left:2px solid var(--line)}
@media (min-width:1024px){
  #topbar{display:none}
  #sidebar{display:flex}
}
@media (min-width:1280px){ #rail{display:flex} }

/* ---------- Cabeçalho (celular) ---------- */
#topbar{position:sticky;top:0;background:var(--bg);border-bottom:2px solid var(--line);z-index:40;transition:background .25s}
#topbar .tb-in{max-width:640px;margin:0 auto;padding:0 16px;height:62px;display:flex;align-items:center;gap:10px}
.logo-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.logo-img{height:36px;max-width:120px;object-fit:contain;border-radius:8px;flex:none}
.logo-name{font-weight:900;font-size:23px;color:var(--p1);letter-spacing:-.5px;white-space:nowrap}
.tb-stats{margin-left:auto;display:flex;gap:14px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;font-weight:900;font-size:15.5px;color:var(--ink)}
.pill.fire{color:var(--fire)}.pill.hpill{color:var(--hpill)}.pill.coin{color:var(--coin)}.pill.xp{color:var(--selT)}
.theme-btn{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;color:var(--ink2);transition:.15s}
.theme-btn:hover{color:var(--selT);border-color:var(--selB)}
@media (max-width:470px){ .pill.xp,.theme-btn{display:none} .logo-name{font-size:19px} .logo-img{height:30px;max-width:90px} }
@media (max-width:380px){ .pill.coin{display:none} }

/* ---------- Sidebar (PC) ---------- */
.sb-logo{display:flex;align-items:center;padding:4px 10px 18px;border-bottom:2px solid var(--line);margin-bottom:12px}
#sidebar .logo-img{height:30px;max-width:88px}
#sidebar .logo-name{font-size:20px}
.snav{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:14px;border:2px solid transparent;
  font-weight:900;font-size:13.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);transition:.15s;width:100%;text-align:left}
.snav svg{flex:none}
.snav.on{background:var(--sel);border-color:var(--selB);color:var(--selT)}
.snav:not(.on):hover{background:var(--hover);color:var(--selT)}
.sb-foot{margin-top:auto;display:grid;gap:8px}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;font-weight:900;font-size:14px}
.sb-user > span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Avatar ---------- */
.avatar{border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--bg2)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.av-fb{background:var(--p1);color:#fff;font-weight:900}
.avatar-edit{position:relative;flex:none}
.avatar-cam{position:absolute;bottom:-2px;right:-2px;width:30px;height:30px;border-radius:50%;
  background:var(--p1);color:#fff;border:3px solid var(--card);display:grid;place-items:center;cursor:pointer;transition:.15s}
.avatar-cam:hover{background:var(--p2)}

/* ---------- Rail (PC) ---------- */
.rail-card{border:2px solid var(--line);border-radius:16px;padding:16px;background:var(--card)}
.rail-card h4{font-weight:900;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.rail-big{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px}
.rail-sub{font-size:12.5px;color:var(--ink2);font-weight:700;margin-top:3px}
.rail-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:900;font-size:15px;padding:5px 0}

/* ---------- Semana ---------- */
.week-row{display:flex;gap:8px}
.wday{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.wday .wdot{flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--line);background:var(--bg2);color:var(--faint)}
.wday .wdot.on{background:var(--p1);border-color:var(--p2);color:#fff}
.wday .wlab{font-size:10.5px;font-weight:900;color:var(--faint);text-transform:uppercase;line-height:1;letter-spacing:.3px}

/* ---------- Conteúdo ---------- */
#app{max-width:640px;margin:0 auto;padding:22px 16px 120px;min-height:70dvh;width:100%}
@media (min-width:1024px){ #app{padding-bottom:40px} }
.view-enter{animation:vin .35s ease both}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1.ptitle{font-weight:900;font-size:26px;letter-spacing:-.3px;margin-bottom:6px}
.sub{color:var(--ink2);font-weight:700;font-size:15px;line-height:1.5}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;transition:background .25s}
.panel{padding:18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;border-radius:8px;padding:4px 10px}

/* ---------- Botões 3D ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  font-weight:900;font-size:14px;letter-spacing:.8px;text-transform:uppercase;
  border-radius:14px;padding:13px 22px;transition:transform .06s,box-shadow .06s,filter .12s;user-select:none;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px)}
.btn.purple{background:var(--p1);color:#fff;box-shadow:0 4px 0 var(--p2)}
.btn.purple:active{box-shadow:0 0 0 var(--p2)}
.btn.amber{background:var(--y1);color:#6B5200;box-shadow:0 4px 0 var(--y2)}
.btn.amber:active{box-shadow:0 0 0 var(--y2)}
.btn.ghost{background:var(--card);border:2px solid var(--line);color:var(--selT);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.btn.small{padding:9px 16px;font-size:12px;border-radius:12px;box-shadow:0 3px 0 var(--p2)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;filter:none}
.progress{height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--p1);border-radius:99px;transition:width .6s ease}

/* ---------- Navegação inferior (somente celular/tablet) ---------- */
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);
  display:flex;justify-content:center;gap:4px;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:50;transition:background .25s}
#nav button{width:60px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;color:var(--faint);font-size:9px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;
  border:2px solid transparent;transition:.15s}
#nav button.on{background:var(--sel);border-color:var(--selB);color:var(--selT)}
#nav button:not(.on):hover{color:var(--selT);background:var(--hover)}
@media (min-width:1024px){ #nav{display:none!important} }

/* ---------- Mascote ---------- */
.mascote{width:150px;object-fit:contain;display:block}
.m-bounce{animation:mb .6s cubic-bezier(.3,1.6,.4,1)}
.m-shake{animation:ms .5s ease}
@keyframes mb{0%,100%{transform:none}35%{transform:translateY(-16px) scale(1.04)}65%{transform:none}82%{transform:translateY(-6px)}}
@keyframes ms{0%,100%{transform:none}20%,60%{transform:translateX(-8px) rotate(-3deg)}40%,80%{transform:translateX(8px) rotate(3deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.floaty{animation:floaty 4s ease-in-out infinite}

/* Cena do mascote: foto + balão de fala */
.boo-scene{position:relative;display:flex;flex-direction:column;align-items:center}
.boo-scene .mascote{width:110px}
.boo-scene.sm .mascote{width:62px}
.boo-bubble{
  position:relative;background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:8px 13px;font-weight:800;font-size:13px;color:var(--ink);max-width:230px;text-align:center;
  margin-bottom:16px;line-height:1.35;animation:bubf 3s ease-in-out infinite;
}
.boo-bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:8px solid transparent;border-top-color:var(--line)}
.boo-bubble::before{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%) translateY(-3px);
  border:6px solid transparent;border-top-color:var(--card)}
.boo-scene.sm .boo-bubble{max-width:170px;font-size:12px;padding:7px 11px;margin-bottom:12px}
@keyframes bubf{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

/* ---------- Home ---------- */
.hero{display:flex;gap:18px;align-items:center;margin-bottom:14px}
.hero-copy{flex:1}
.hero h1{font-weight:900;font-size:clamp(22px,4.5vw,30px);letter-spacing:-.4px;line-height:1.15;margin:4px 0 8px}
.quote{padding:10px 14px;border:2px dashed var(--line2);border-radius:12px;font-size:14px;color:var(--ink2);font-weight:700;display:inline-block}
.hero-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.hero .boo-scene .mascote{width:130px}
.hero .boo-bubble{max-width:160px;font-size:12px}
.home-grid{display:grid;gap:12px;margin-top:12px}
.panel-row{display:flex;align-items:center;gap:14px}
.panel-row .ico{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--sel);color:var(--selT)}
.panel h3{font-weight:900;font-size:16.5px}
.p-sub{font-size:13.5px;color:var(--ink2);font-weight:700;line-height:1.45}
.panel-row .grow{flex:1}
.progress-line{display:flex;align-items:center;gap:12px;margin-top:12px}
.progress-line .progress{flex:1}
.progress-line b{font-weight:900;font-size:14px;color:var(--ink2);min-width:38px;text-align:right}
.meters{display:grid;gap:11px;margin-top:14px}
.meter{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:13px}
.meter .progress{grid-column:1/-1;height:12px}
.meter b{color:var(--ink2);font-weight:800}
.meter span{font-weight:900}

/* ---------- Perfil — engrenagem integrada ao card ---------- */
.prof-head{position:relative}
.gear-btn{
  position:absolute;top:14px;right:14px;
  width:40px;height:40px;border-radius:12px;border:2px solid var(--line);
  background:var(--card);display:grid;place-items:center;color:var(--ink2);transition:.15s;
}
.gear-btn:hover{color:var(--selT);border-color:var(--selB);background:var(--hover)}

/* ---------- Etiqueta de dificuldade + banner da trilha ---------- */
.diff-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;border-radius:6px;padding:2px 8px;color:#fff}
.trail-banner{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.trail-banner.standalone{margin:12px 0 4px}
.trail-banner .tb-ico{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.trail-banner .grow{flex:1;min-width:0}
.trail-banner b{font-size:16px;font-weight:900;letter-spacing:-.2px;display:block}
.trail-banner .p-sub{color:rgba(255,255,255,.92)}
.trail-banner .progress{background:rgba(0,0,0,.28);margin-top:8px;height:12px}
.trail-banner .progress i{background:#fff}

/* ---------- Trilha (Aprender) ---------- */
.path{position:relative;margin:14px auto 0}
.path svg.trail-line{position:absolute;left:0;top:0;pointer-events:none}
.path .trail-banner{position:absolute;left:0;right:0;z-index:1}
.uhead{position:absolute;left:-16px;right:-16px;height:56px;border-radius:16px;color:#fff;
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:1}
.uhead b{font-weight:900;font-size:15px;letter-spacing:.6px;text-transform:uppercase}
.uhead small{font-weight:800;font-size:11px;opacity:.9;letter-spacing:.5px;text-transform:uppercase}
.pnode{
  position:absolute;width:70px;height:70px;border-radius:50%;z-index:2;
  display:flex;align-items:center;justify-content:center;color:#fff;
  transition:transform .1s, box-shadow .1s;user-select:none;cursor:pointer;
}
.pnode .nic{display:flex;align-items:center;justify-content:center;width:28px;height:28px}
.pnode .nic svg{display:block;transform:none}
.pnode:hover{transform:translateY(-2px)}
.pnode:active{transform:translateY(3px)}
.pnode.done{background:var(--p1);box-shadow:0 6px 0 var(--p2)}
.pnode.done:active{box-shadow:0 1px 0 var(--p2)}
.pnode.legend{background:var(--y1);box-shadow:0 6px 0 var(--y2);color:#6B5200}
.pnode.legend:active{box-shadow:0 1px 0 var(--y2)}
.pnode.open{background:var(--y1);box-shadow:0 6px 0 var(--y2);color:#fff;animation:npulse 2s infinite}
.pnode.open:active{box-shadow:0 1px 0 var(--y2)}
.pnode.locked{background:var(--line);box-shadow:0 6px 0 var(--line2);color:var(--faint);cursor:default}
.pnode.locked:hover{transform:none}
@keyframes npulse{0%,100%{box-shadow:0 6px 0 var(--y2),0 0 0 0 rgba(255,200,0,.45)}50%{box-shadow:0 6px 0 var(--y2),0 0 0 12px rgba(255,200,0,0)}}
.pnode::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;padding:7px 12px;border-radius:10px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:5}
.pnode:hover::after{opacity:1}
.start-bub{position:absolute;transform:translateX(-50%);background:var(--card);border:2px solid var(--line);
  border-radius:12px;padding:7px 14px;font-weight:900;font-size:12px;letter-spacing:1px;color:var(--selT);
  z-index:3;animation:sb 1.4s ease-in-out infinite;white-space:nowrap}
.start-bub::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:7px solid transparent;border-top-color:var(--line)}
@keyframes sb{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-7px)}}

/* ---------- Lição ---------- */
.lesson-shell{max-width:600px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:16px;margin-bottom:26px}
.qtop .xbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--faint);transition:.15s;flex:none}
.qtop .xbtn:hover{color:var(--badT);background:var(--badBg)}
.qtop .qprog{flex:1}
.qtop .qhp{display:flex;align-items:center;gap:5px;color:var(--hpill);font-weight:900;font-size:16px}
.q-tag{font-size:11px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--selT);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-text{font-weight:900;font-size:clamp(19px,3vw,23px);line-height:1.3;margin-bottom:20px}
.q-visual{background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:20px 14px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.q-visual .row{display:flex;gap:8px;justify-content:center}
.riddle-box{background:var(--sel);border:2px solid var(--selB);border-radius:16px;padding:22px 18px;margin-bottom:20px;font-weight:900;font-size:19px;line-height:1.45;text-align:center;color:var(--selT)}
.riddle-box::before{content:"ENIGMA";display:block;font-size:10px;letter-spacing:3px;color:var(--selT);margin-bottom:8px}
.opts{display:grid;gap:11px}
.opts.two{grid-template-columns:1fr 1fr}
@media (max-width:520px){ .opts.two{grid-template-columns:1fr} }
.opt{
  display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;
  background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;
  padding:14px 16px;font-weight:800;font-size:16px;color:var(--ink);min-height:56px;transition:.12s;animation:vin .3s both;
}
.opt:hover{background:var(--hover);border-color:var(--selB);color:var(--selT)}
.opt:active{transform:translateY(2px)}
.opt.sel{background:var(--sel);border-color:var(--selB);color:var(--selT)}
.opt.right{background:var(--accBg);border-color:var(--accB);color:var(--accT)}
.opt.wrong{background:var(--badBg);border-color:var(--badB);color:var(--badT);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.tf-row .opt{padding:22px 16px;font-size:17px;font-weight:900}
.tf-row .opt .big{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.tf-row .opt[data-v="true"] .big{background:var(--accBg);color:var(--accT)}
.tf-row .opt[data-v="false"] .big{background:var(--badBg);color:var(--badT)}
.seq-line{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seq-cell{width:52px;height:52px;border-radius:12px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.seq-cell.q{background:var(--sel);border-color:var(--selB);color:var(--selT)}
.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match-col{display:grid;gap:10px;align-content:start}
.mitem{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px;font-weight:800;font-size:14px;text-align:center;transition:.12s;min-height:52px;display:flex;align-items:center;justify-content:center}
.mitem:active{transform:translateY(2px)}
.mitem.sel{border-color:var(--selB);background:var(--sel);color:var(--selT)}
.mitem.paired{cursor:default}
.mitem.dim{opacity:.35}
.mitem .pairdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.match-hint{text-align:center;font-size:12px;color:var(--faint);font-weight:800;margin-top:12px}
.order-slots{display:grid;gap:9px;margin:14px 0}
.oslot{min-height:56px;border-radius:14px;border:2px dashed var(--line2);display:flex;align-items:center;padding:8px 12px;gap:10px;transition:.12s;font-weight:800;font-size:14.5px}
.oslot.over{border-color:var(--y1);background:var(--goldBg)}
.oslot.filled{border-style:solid;border-color:var(--selB);background:var(--sel)}
.oslot .num{flex:none;width:24px;height:24px;border-radius:8px;background:var(--line);color:var(--ink2);display:grid;place-items:center;font-size:12px;font-weight:900}
.order-bank{display:flex;flex-wrap:wrap;gap:9px;min-height:62px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--bg2)}
.ocard{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:10px 15px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;user-select:none;touch-action:none;animation:vin .3s both;color:var(--ink)}
.ocard.sel{border-color:var(--selB);background:var(--sel);color:var(--selT)}
.ocard.dragging{opacity:.35}
.ocard.ghost{position:fixed;z-index:99;pointer-events:none;transform:scale(1.05);opacity:.95}
.drag-hint{text-align:center;font-size:12px;color:var(--faint);font-weight:800;margin-bottom:12px}
.l-footer{margin-top:26px;display:flex;justify-content:flex-end}

/* ---------- Barra de resultado ---------- */
#sheet{position:fixed;inset-inline:0;bottom:0;z-index:60;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.3,1.05)}
#sheet.show{transform:none}
#sheet .sheet-in{max-width:640px;margin:0 auto;padding:0 14px calc(14px + env(safe-area-inset-bottom))}
.sheet-card{border-radius:18px;padding:20px 22px;color:#fff}
.sheet-card.ok{background:var(--p1)}
.sheet-card.bad{background:var(--r1)}
.sheet-flex{display:flex;gap:16px;align-items:center}
.sheet-flex .boo-scene .mascote{width:62px}
.sheet-title{font-weight:900;font-size:22px}
.sheet-body{font-size:14.5px;font-weight:700;line-height:1.5;opacity:.95;margin-top:4px}
.sheet-hint{margin-top:10px;background:rgba(255,255,255,.18);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:flex-start}
.sheet-btn{margin-top:14px;width:100%;background:#fff;color:#555;font-weight:900;font-size:15px;letter-spacing:.8px;text-transform:uppercase;padding:13px;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.sheet-btn:active{transform:translateY(4px);box-shadow:0 0 0 rgba(0,0,0,.18)}

/* ---------- Desafios ---------- */
.chal-card{padding:22px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chal-card .cic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin-bottom:6px}
.chal-card h3{font-weight:900;font-size:19px}
.chal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media (max-width:640px){ .chal-grid{grid-template-columns:1fr} }
.timer-bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 24px}
.timer-bar i{display:block;height:100%;background:var(--y1);border-radius:99px;transition:width .25s linear}
.f-top{display:flex;justify-content:space-between;align-items:center;gap:14px;font-weight:900;font-size:15px;color:var(--ink2)}
.f-top .fleft{display:flex;align-items:center;gap:12px}
.f-top .xbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--faint);transition:.15s}
.f-top .xbtn:hover{color:var(--badT);background:var(--badBg)}
.f-top .sc{display:flex;align-items:center;gap:6px;color:var(--p1);font-weight:900;font-size:20px}
.flash-score-big{font-weight:900;font-size:64px;letter-spacing:-2px;line-height:1;color:var(--p1)}

/* ---------- Ranking ---------- */
.lb{display:grid;gap:8px}
.lb-row{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line)}
.lb-row .pos{width:30px;font-weight:900;font-size:15px;color:var(--faint);text-align:center}
.lb-row .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px;flex:none}
.lb-row .nm{font-weight:800;font-size:15px}
.lb-row .xp{margin-left:auto;font-weight:900;font-size:14px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.lb-row.me{border-color:var(--selB);background:var(--sel)}
.lb-row.top1{border-color:var(--y1);background:var(--goldBg)}

/* ---------- Perfil ---------- */
.prof-head{display:flex;gap:18px;align-items:center;padding:20px;flex-wrap:wrap}
.prof-head h2{font-weight:900;font-size:23px;display:flex;align-items:center;gap:10px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}
.stat-box{border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.stat-box .v{font-weight:900;font-size:21px}
.stat-box .k{font-size:10.5px;color:var(--faint);font-weight:900;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.stat-box.yb{border-color:var(--y1);background:var(--goldBg)}.stat-box.yb .v{color:var(--goldT)}
.stat-box.pb{border-color:var(--accB);background:var(--accBg)}.stat-box.pb .v{color:var(--accT)}
.stat-box.bb{border-color:var(--selB);background:var(--sel)}.stat-box.bb .v{color:var(--selT)}
.stat-box.rb{border-color:var(--badB);background:var(--badBg)}.stat-box.rb .v{color:var(--badT)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:14px}
.ach{border:2px solid var(--line);border-radius:14px;padding:13px;display:flex;gap:11px;align-items:center;background:var(--card)}
.ach .aic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--y1);color:#6B5200}
.ach.locked{opacity:.45;filter:grayscale(1)}
.ach.locked .aic{background:var(--line);color:var(--faint)}
.ach b{font-size:13.5px;display:block}
.ach span{font-size:11.5px;color:var(--faint);font-weight:700;line-height:1.35;display:block;margin-top:2px}
.sec-title{font-weight:900;font-size:19px;margin:26px 0 10px}

/* ---------- Escolha de tema ---------- */
.theme-choose{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}
.theme-opt{border:2px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:900;font-size:13px;color:var(--ink2);transition:.15s}
.theme-opt.on{border-color:var(--selB);background:var(--sel);color:var(--selT)}
.theme-opt .sw{width:48px;height:32px;border-radius:8px;border:2px solid var(--line2)}
.theme-opt .sw.lights{background:#fff}
.theme-opt .sw.darks{background:#111}

/* ---------- Configurações ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:2px solid var(--line)}
.set-row:last-of-type{border-bottom:none}
.set-row .set-label{font-weight:900;font-size:15px}
.switch{width:52px;height:30px;border-radius:99px;background:var(--line2);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.switch.on{background:var(--p1)}
.switch.on::after{left:25px}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:18px;animation:fadein .2s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:18px;padding:26px;max-width:430px;width:100%;animation:mup .3s cubic-bezier(.3,1.4,.5,1) both;max-height:88dvh;overflow:auto;border-top:8px solid var(--p1);transition:background .25s}
@keyframes mup{from{opacity:0;transform:translateY(24px) scale(.95)}to{opacity:1;transform:none}}
.modal h2{font-weight:900;font-size:22px;letter-spacing:-.3px;margin-bottom:6px}
.modal p{color:var(--ink2);font-weight:700;font-size:14.5px;line-height:1.55}
.modal .btn{width:100%;margin-top:10px}
.modal input[type=text]{width:100%;padding:13px 15px;border-radius:12px;border:2px solid var(--line);font-size:16px;font-weight:700;margin-top:16px;outline:none;transition:.15s;background:var(--bg2);color:var(--ink)}
.modal input[type=text]:focus{border-color:var(--selB);background:var(--card)}
.scene-center{display:flex;justify-content:center;margin-bottom:8px}
.scene-center .boo-scene .mascote{width:120px}
.reward-list{display:grid;gap:8px;margin:16px 0}
.reward-list .r{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:12px;padding:11px 14px;font-weight:800;font-size:14px}
.reward-list .r b{margin-left:auto;font-weight:900;text-align:right}

/* ---------- Resultado ---------- */
.result-hero{text-align:center;padding:8px 0 4px}
.stars-row{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}
.stars-row .st{width:48px;height:48px;color:var(--line);transform:scale(0)}
.stars-row .st.on{color:var(--y1)}
.stars-row .st:nth-child(1){animation:starin .5s .25s cubic-bezier(.3,1.8,.5,1) both}
.stars-row .st:nth-child(2){animation:starin .5s .45s cubic-bezier(.3,1.8,.5,1) both}
.stars-row .st:nth-child(3){animation:starin .5s .65s cubic-bezier(.3,1.8,.5,1) both}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.res-stats .stat-box{text-align:center}

/* ---------- Toasts / confete / xp ---------- */
#toasts{position:fixed;top:72px;right:14px;z-index:80;display:grid;gap:8px;justify-items:end}
@media (min-width:1024px){ #toasts{top:16px;right:352px} }
.toast{display:flex;align-items:center;gap:9px;background:var(--ink);color:var(--bg);font-weight:800;font-size:13px;padding:10px 15px;border-radius:12px;max-width:320px;animation:tin .3s cubic-bezier(.3,1.5,.5,1) both}
.toast.gold{background:var(--y1);color:#6B5200}
.toast.out{animation:tout .3s both}
@keyframes tin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.float-xp{position:fixed;z-index:85;font-weight:900;color:var(--selT);font-size:16px;pointer-events:none;animation:fxp 1.1s ease-out both}
@keyframes fxp{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
</style>
</head>
<body>

<canvas id="confetti"></canvas>
<div id="toasts"></div>
<input type="file" id="avatarFile" accept="image/*" style="display:none" aria-hidden="true">
<input type="file" id="importFile" accept=".json,application/json" style="display:none" aria-hidden="true">

<div id="layout">
  <aside id="sidebar" aria-label="Menu principal"></aside>
  <div id="mainCol">
    <header id="topbar"><div class="tb-in" id="tbIn"></div></header>
    <main id="app"></main>
  </div>
  <aside id="rail" aria-label="Seu progresso"></aside>
</div>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="modal-root"></div>

<script>
"use strict";
/* ================================================================
   WAZYBOO v1.8 — trilha única sequencial, 33 fases sem repetição
   Fases removidas por redundância:
   · Padrões duplos (repetia o 1º padrão)          · Padrões do dia a dia (conteúdo fraco)
   · Sequências de formas (repetia padrões visuais)· Saltos alternados (variação da regra)
   · Agrupando ideias (o tipo "associação" foi     · Pistas simples (Quem é quem cobre)
     preservado dentro de Comparações)             · Comparando (repetia Ordem de chegada)
   Todos os demais bugs corrigidos na v1.7 continuam resolvidos.
   ================================================================ */

const NOME_APP = 'Wazyboo';
const APP_VERSION = '1.8';

const IMG = {
  logo: 'logo.png',
  mascote: 'mascote.png',
};

/* ================================================================
   FOTOS DO WAZYBOO POR OCASIÃO
   ================================================================ */
const IMG_MASCOTE = {
  normal:      'normal.png',
  feliz:       'feliz.png',
  triste:      'triste.png',
  comemorando: 'comemorando.png',
  pensando:    'pensando.png',
  medalha:     'medalha.png',
  coracoes:    'coracoes.png',
  diario:      'comemorando.png',
  relampago:   'feliz.png',
  nivel:       'medalha.png',
  conquista:   'medalha.png',
  boasVindas:  'normal.png',
};

/* FALAS DO WAZYBOO — edite à vontade */
const BOO_FALAS = {
  normal:      ['Pronto para mais um desafio?','Erros são degraus da lógica!','Eu acredito em você!','Vamos treinar essa mente?','Que bom te ver por aqui!'],
  feliz:       ['Boa! Eu sabia que você conseguia!','É exatamente isso!','Mandou muito bem!','Seu cérebro está brilhando!','Exato! Adoro quando acontece!'],
  triste:      ['Quase! Bora de novo!','Sem stress, errar também ensina.','Eu estou aqui com você!','A próxima você acerta, aposto!','Respira fundo e tenta de novo!'],
  comemorando: ['Concluímos juntos! Que vitória!','Você arrasou nessa lição!','Que mente incrível a sua!','Mais um degrau na trilha!','Eu comemorei cada resposta!'],
  diario:      ['O desafio de hoje é seu!','Missão diária cumprida!','Amanhã tem mais, hein!','Rotina de gênio!'],
  relampago:   ['Que velocidade! Até eu tonteiei!','Sua mente é um raio!','Rápido e certeiro!','Relâmpago? Você que é!'],
  nivel:       ['Subiu de nível! Estou tão orgulhoso!','Olha só você evoluindo!','Novo nível desbloqueado!'],
  conquista:   ['Conquista desbloqueada!','Guardei essa medalha para você!','Você mereceu cada uma!'],
  coracoes:    ['Ops... precisamos de corações!','Eles voltam logo, prometo!','Uma pausa estratégica!'],
  pensando:    ['Vou com você nessa!','Respire fundo e olhe com calma.','Ache o padrão — eu espero aqui!','Concentre-se, você consegue!'],
  boasVindas:  ['Olá! Eu sou o Wazyboo!','Que bom te ver por aqui!','Bem-vindo à nossa trilha!'],
};

const MASCOTE_FALLBACK = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='52' r='40' fill='%23888'/%3E%3Ccircle cx='38' cy='46' r='6' fill='%23555'/%3E%3Ccircle cx='62' cy='46' r='6' fill='%23555'/%3E%3Cpath d='M38 64q12 10 24 0' stroke='%23555' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E";

const booFoto = estado => IMG_MASCOTE[estado] || IMG.mascote || MASCOTE_FALLBACK;
const booFala = estado => { const a = BOO_FALAS[estado] || BOO_FALAS.normal; return a[Math.floor(Math.random()*a.length)]; };
function booScene(estado, cls = ''){
  return `<div class="boo-scene ${cls}">
    <div class="boo-bubble">${esc(booFala(estado))}</div>
    <img class="mascote" src="${booFoto(estado)}" alt="Wazyboo" onerror="this.onerror=null;this.src='${MASCOTE_FALLBACK}'">
  </div>`;
}
const mascotHTML = (cls = '') => `<img class="mascote ${cls}" src="${booFoto('normal')}" alt="Wazyboo" onerror="this.onerror=null;this.src='${MASCOTE_FALLBACK}'">`;
function cheer(el){ const m = el && (el.matches('.mascote') ? el : el.querySelector('.mascote')); if(!m) return; m.classList.remove('m-bounce','m-shake'); void m.offsetWidth; m.classList.add('m-bounce'); }
function scold(el){ const m = el && (el.matches('.mascote') ? el : el.querySelector('.mascote')); if(!m) return; m.classList.remove('m-bounce','m-shake'); void m.offsetWidth; m.classList.add('m-shake'); }

const logoHTML = () => `<span class="logo-wrap">
  <img class="logo-img" src="${IMG.logo}" alt="" onerror="this.style.display='none'">
  <span class="logo-name">${NOME_APP}</span>
</span>`;
(function(){ const l = document.createElement('link'); l.rel = 'icon'; l.href = IMG.logo; document.head.appendChild(l); })();

/* ---------- Armazenamento protegido (modo privado etc.) ---------- */
const storeGet  = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const storeSet  = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const storeDel  = k => { try{ localStorage.removeItem(k); }catch(e){} };
const deepClone = o => (typeof structuredClone === 'function') ? structuredClone(o) : JSON.parse(JSON.stringify(o));

/* ---------- Tema ---------- */
const THEME_KEY = 'wazyboo_theme';
const getTheme = () => storeGet(THEME_KEY) || 'light';
document.documentElement.dataset.theme = getTheme();
function setTheme(t){
  document.documentElement.dataset.theme = t;
  storeSet(THEME_KEY, t);
  renderTop();
}

/* ---------- Utilitários ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const dkey = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const todayKey = () => dkey(new Date());
const yesterdayKey = () => dkey(new Date(Date.now() - 864e5));
function seededRng(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return function(){ h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
const pickSeed = (arr, rng) => arr[Math.floor(rng() * arr.length)];

/* ---------- Ícones ---------- */
const ICONS = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  book:'<path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h13"/>',
  zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a1 1 0 0 0-1 1c0 2 2 4 4 4M17 6h3a1 1 0 0 1 1 1c0 2-2 4-4 4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-5 8-5s6.5 1 8 5"/>',
  heart:'<path d="M12 20s-7-4.6-9.2-9A5.2 5.2 0 0 1 12 6.4 5.2 5.2 0 0 1 21.2 11C19 15.4 12 20 12 20z"/>',
  flame:'<path d="M12 22c4 0 7-2.5 7-6.5 0-3-2-5-3.5-7C14 6 13 4 13 2c-3 2-4 5-4 7-1-.8-1.5-2-1.5-3C5.5 8 5 10.5 5 13.5 5 19.5 8 22 12 22z"/>',
  coin:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
  star:'<polygon points="12 2 15 8.5 22 9.3 17 14 18.3 21 12 17.6 5.7 21 7 14 2 9.3 9 8.5"/>',
  check:'<path d="M4 12l5 5L20 7"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.7 1 1.5 1 2.5h6c0-1 .2-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  sparkle:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9L19 16z"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/>',
  pencil:'<path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/>',
  crown:'<path d="M3 17l2-9 5 4 2-6 2 6 5-4 2 9H3z"/><path d="M5 21h14"/>',
  calendar:'<rect x="4" y="6" width="16" height="15" rx="2"/><path d="M8 3v5M16 3v5M4 11h16"/>',
  play:'<polygon points="8 5 19 12 8 19 8 5"/>',
  flag:'<path d="M5 21V4c4-2 8 2 14 0v10c-6 2-10-2-14 0"/>',
  shapes:'<rect x="3.5" y="12.5" width="8.5" height="8.5" rx="2"/><circle cx="16.5" cy="8" r="5"/>',

  {t:'mc',cat:'Padrões',v:seqHTML([dots(1),dots(3),dots(5)]),q:'A quantidade cresce sempre do mesmo jeito. Quantos pontos vêm?',o:[dots(6,COL.a),dots(7,COL.a),dots(8,COL.a),dots(9,COL.a)],a:1,h:'Compare cada quadro com o anterior: quanto aumenta?',x:'Cresce de 2 em 2: 1, 3, 5… e agora 7 (só os ímpares).'},
  {t:'seq',cat:'Padrões',v:seqHTML(['1','2','4','7','11','?']),q:'Complete a sequência.',o:['15','16','17','18'],a:1,h:'Calcule os saltos entre termos vizinhos: +1, +2, +3…',x:'Os saltos crescem: +1, +2, +3, +4 e agora +5. 11 + 5 = 16.'},
  {t:'mc',cat:'Padrões',q:'Figuras feitas de palitos: a 1ª usa 3, a 2ª usa 6, a 3ª usa 9. Quantos palitos tem a 5ª figura?',o:['12','14','15','18'],a:2,h:'Multiplique a posição da figura por 3.',x:'Cada figura usa 3 palitos a mais: 3, 6, 9, 12 e 15. A 5ª usa 15 palitos.'},
  {t:'mc',cat:'Padrões',v:seqHTML(['1','3','6','10','?']),q:'Complete a sequência.',o:['12','13','14','15'],a:3,h:'Os saltos são +2, +3, +4… percebeu?',x:'São os números triangulares: somamos 2, depois 3, depois 4 e agora 5. 10 + 5 = 15.'},
  {t:'tf',cat:'Padrões',q:'Na sequência 2, 4, 8, 16, cada termo é o dobro do anterior.',a:true,h:'Compare cada número com o anterior: soma ou multiplicação?',x:'2 × 2 = 4, 4 × 2 = 8, 8 × 2 = 16. É sempre o dobro. Verdadeiro!'},
]},
{ id:'seq3', mod:'seq', d:2, title:'A regra da sequência', desc:'Encontre a lei — inclusive as compostas',
  ex:[
  {t:'mc',cat:'Sequências',q:'Qual é a regra da sequência  2, 5, 8, 11?',o:['Somar 3','Somar 4','Multiplicar por 2','Alternar +2 e +3'],a:0,h:'Calcule a diferença entre termos vizinhos.',x:'De 2 → 5 → 8 → 11 somamos sempre 3. Regras se descobrem medindo os saltos.'},
  {t:'seq',cat:'Sequências',v:seqHTML(['3','6','12','24','?']),q:'Complete a sequência.',o:['30','36','48','64'],a:2,h:'A regra aqui multiplica, não soma.',x:'Cada termo é o dobro do anterior: 24 × 2 = 48.'},
  {t:'seq',cat:'Sequências',v:seqHTML(['1','4','2','5','3','?']),q:'Complete a sequência.',o:['5','6','7','8'],a:1,h:'Calcule os saltos: +3, −2, +3, −2…',x:'Os saltos alternam +3 e −2. Depois do 3, soma 3 de novo: 3 + 3 = 6.'},
  {t:'mc',cat:'Sequências',q:'Qual é a regra da sequência  5, 10, 8, 16, 14, 28, …?',o:['Multiplicar por 2 e depois subtrair 2','Somar 5 sempre','Dividir por 2','Alternar +10 e −2'],a:0,h:'Teste cada regra candidata na sequência inteira.',x:'5 ×2 = 10, 10 −2 = 8, 8 ×2 = 16, 16 −2 = 14, 14 ×2 = 28. É "×2 e −2" alternados.'},
  {t:'mc',cat:'Sequências',q:'Sequência famosa:  1, 4, 9, 16, 25, …  Qual vem depois?',o:['30','36','42','49'],a:1,h:'Quebre cada número em um produto: 1×1, 2×2, 3×3…',x:'São os quadrados perfeitos: 1², 2², 3², 4², 5² e agora 6² = 36.'},
]},
{ id:'cls3', mod:'cls', d:2, title:'Comparações', desc:'Maior, menor, parte–todo e associações',
  ex:[
  {t:'mc',cat:'Classificação',q:'Ana é mais alta que Bia. Bia é mais alta que Cris. Quem é a mais baixa?',o:['Ana','Bia','Cris','Não dá para saber'],a:2,h:'Organize as três em ordem de altura.',x:'Ana > Bia > Cris. A menor da fila é Cris.'},
  {t:'mc',cat:'Classificação',q:'Se A > B e B > C, então:',o:['A > C','A < C','A = C','É impossível comparar'],a:0,h:'Essa é a propriedade de transição da desigualdade.',x:'Se A supera B e B supera C, A supera C. É a transitividade.'},
  {t:'match',cat:'Classificação',q:'Associe cada parte ao seu todo.',pairs:[['Dedo','Mão'],['Dente','Boca'],['Página','Livro']],h:'Pense na relação parte–todo.',x:'Dedo é parte da mão; dente é parte da boca; página é parte do livro. A relação parte–todo serve para tudo isso.'},
  {t:'mc',cat:'Classificação',q:'O melão pesa mais que a laranja; a laranja pesa mais que a uva. O mais leve é:',o:['o melão','a laranja','a uva','todos pesam igual'],a:2,h:'Monte a fila do mais pesado ao mais leve.',x:'Melão > laranja > uva. O último da fila é o mais leve: a uva.'},
  {t:'tf',cat:'Classificação',q:'Se Pedro corre mais rápido que Lucas, então Lucas corre mais devagar que Pedro.',a:true,h:'Pense nos dois pontos de vista da mesma corrida.',x:'"Mais rápido" e "mais devagar" são dois lados da mesma comparação. Verdadeiro!'},
]},
{ id:'ded3', mod:'ded', d:2, title:'Eliminando possibilidades', desc:'Pistas combinadas fecham o cerco',
  ex:[
  {t:'mc',cat:'Dedução',q:'O código é um número de 1 a 9. Não é par, não é 9 e é maior que 5. Qual é o código?',o:['5','6','7','8'],a:2,h:'Risque os pares, depois o 9, depois os ≤ 5.',x:'Saem os pares (2,4,6,8), o 9 e os menores ou iguais a 5. Só sobra o 7.'},
  {t:'mc',cat:'Dedução',q:'Hoje não é segunda, não é quarta e não é quinta. Qual dia NÃO pode ser hoje?',o:['Terça','Sexta','Quarta','Domingo'],a:2,h:'A pergunta pede um dia proibido pelas pistas.',x:'Quarta foi explicitamente descartada. As outras três continuam possíveis.'},
  {t:'mc',cat:'Dedução',q:'A bola sorteada (de 1 a 10) é maior que 7, é par e é múltipla de 5. Qual é a bola?',o:['6','8','10','9'],a:2,h:'Aplique uma pista de cada vez.',x:'Maior que 7: 8, 9, 10. Par: 8 e 10. Múltipla de 5: sobra o 10.'},
  {t:'tf',cat:'Dedução',q:'"Quando você elimina todas as outras possibilidades, o que sobra, por mais improvável, é a resposta." Esse princípio descreve o raciocínio por eliminação.',a:true,h:'É a famosa máxima do detetive.',x:'Exatamente: eliminar o impossível deixa o possível — mesmo que pareça improvável. Verdadeiro!'},
  {t:'mc',cat:'Dedução',q:'Cinco portas numeradas de 1 a 5. O prêmio não está numa porta par, nem na 1, nem na 5. Em qual porta ele está?',o:['Porta 2','Porta 3','Porta 4','Em nenhuma'],a:1,h:'Elimine as pares e depois 1 e 5.',x:'Pares fora (2 e 4), depois 1 e 5. Restou apenas a porta 3.'},
]},
{ id:'ord3', mod:'ord', d:2, title:'Encaixando verdades', desc:'Ordem + pistas combinadas',
  ex:[
  {t:'mc',cat:'Ordenação',q:'Três planetas em fila. Marte não é o primeiro nem o último. Vênus é o primeiro. Qual está no meio?',o:['Vênus','Marte','Terra','Não dá para saber'],a:1,h:'Comece pela posição que já está fixada.',x:'Vênus é 1º; Marte, sem poder ser 1º ou 3º, sobra no meio; Terra fica em 3º.'},
  {t:'order',cat:'Ordenação',q:'Organize os passos da receita de bolo.',items:['Misturar os ingredientes','Assar a massa','Decorar o bolo'],h:'O que precisa existir antes de decorar?',x:'Mistura → forno → decoração. Sequências de processo também são ordem lógica.'},
  {t:'mc',cat:'Ordenação',q:'Na estante, o livro A está à esquerda de B, e B está à esquerda de C. Qual livro está à direita dos outros?',o:['A','B','C','Nenhum'],a:2,h:'Desenhe a fila: A, B, C.',x:'A → B → C da esquerda para a direita. O C é o mais à direita.'},
  {t:'tf',cat:'Ordenação',q:'Se segunda vem antes de terça, então terça vem imediatamente depois de segunda.',a:true,h:'Pense na estrutura da semana.',x:'Na sequência dos dias da semana, terça é a sucessora direta de segunda. Verdadeiro!'},
  {t:'mc',cat:'Ordenação',q:'Lia corre antes do nascer do sol; Mia corre depois. Quem corre primeiro?',o:['Lia','Mia','As duas juntas','Não dá para saber'],a:0,h:'"Antes do nascer do sol" vem antes de tudo.',x:'A ordem é: Lia (antes do sol) → nascer do sol → Mia. Lia corre primeiro.'},
]},
{ id:'log3', mod:'log', d:2, title:'Se… então', desc:'O condicional e seus truques',
  ex:[
  {t:'mc',cat:'Lógica',q:'"Se está chovendo, então levo guarda-chuva." Está chovendo. Logo:',o:['levo guarda-chuva','não levo guarda-chuva','talvez leve','nada posso concluir'],a:0,h:'A condição do "se" aconteceu — aplique a promessa.',x:'É o modus ponens: confirmando a condição, a consequência se cumpre.'},
  {t:'mc',cat:'Lógica',q:'"Se um número é divisível por 4, então é par." 8 é divisível por 4. Logo:',o:['8 é par','8 é ímpar','8 não é número','8 é divisível por 3'],a:0,h:'Confirme a condição e siga a regra.',x:'A condição vale para o 8, então a conclusão vale: 8 é par.'},
  {t:'mc',cat:'Lógica',q:'"Se chove, a rua fica molhada." A rua NÃO está molhada. Logo:',o:['choveu','não choveu','vai chover','nada posso concluir'],a:1,h:'Se tivesse chovido, como estaria a rua?',x:'É o modus tollens: negar a consequência força negar a condição. Não choveu.'},
  {t:'tf',cat:'Lógica',q:'"Se p então q" é falso apenas quando p é verdadeiro e q é falso.',a:true,h:'Pense na única quebra de promessa possível.',x:'A promessa só falha se a condição ocorreu e a consequência não. É a única linha F da tabela-verdade.'},
  {t:'mc',cat:'Lógica',q:'"Se você tirar 10, ganha o prêmio." Você tirou 10, mas NÃO ganhou o prêmio. O que concluímos?',o:['A promessa se cumpriu','A promessa era falsa','A nota estava errada','Nada podemos concluir'],a:1,h:'A condição foi cumprida. E a consequência?',x:'Com a condição realizada, o condicional obrigava o prêmio. Sem prêmio, a promessa era falsa.'},
]},
{ id:'eni1', mod:'eni', d:2, title:'Enigmas clássicos', desc:'Pense fora da caixa',
  ex:[
  {t:'riddle',cat:'Enigmas',q:'O pai de João tem cinco filhos: Nana, Nene, Nini, Nono e…?',o:['Nunu','João','Júnior','Nana'],a:1,h:'Releia a primeira frase com muita atenção.',x:'A resposta estava no enunciado: um dos cinco filhos é o próprio João!'},
  {t:'riddle',cat:'Enigmas',q:'Quanto mais você tira de mim, maior eu fico. O que sou?',o:['A sombra','O buraco','O bolo','O silêncio'],a:1,h:'Pense em algo cujo tamanho é definido por ausência.',x:'Quanto mais terra você remove, maior fica o buraco.'},
  {t:'riddle',cat:'Enigmas',q:'Se você me tem, quer me contar; mas se me conta, deixo de existir. O que sou?',o:['A notícia','O segredo','A piada','A moeda'],a:1,h:'O que desaparece no exato momento em que é dividido?',x:'Contar um segredo deixa de guardá-lo: ele existe apenas enquanto é mantido.'},
  {t:'mc',cat:'Enigmas',q:'Há 5 passarinhos em uma árvore. Um caçador atira e acerta um. Quantos sobram na árvore?',o:['4','1','0','5'],a:2,h:'O barulho do tiro assusta os outros…',x:'O tiro espanta os outros quatro. Na árvore não sobra nenhum voando — a resposta clássica é 0.'},
  {t:'riddle',cat:'Enigmas',q:'O que sobe quando a chuva desce?',o:['A temperatura','O guarda-chuva','O rio','O sol'],a:1,h:'Pense no gesto que todo mundo faz quando começa a chover.',x:'Quando a chuva desce, o guarda-chuva sobe!'},
]},

/* --- Avançado (9 fases) --- */
{ id:'seq5', mod:'seq', d:3, title:'Sequências de campeões', desc:'Onde a maioria tropeça',
  ex:[
  {t:'mc',cat:'Sequências',q:'Qual continua:  1, 3, 7, 15, 31, …?',o:['47','55','63','71'],a:2,h:'Cada termo é o dobro do anterior… e mais alguma coisa.',x:'A regra é "×2 e +1": 31 × 2 + 1 = 63. Confira: 15 × 2 + 1 = 31 ✓'},
  {t:'seq',cat:'Sequências',v:seqHTML(['64','32','16','8','?']),q:'Complete a sequência.',o:['2','4','6','8'],a:1,h:'Aqui dividimos, não subtraímos.',x:'Cada termo é a metade do anterior: 8 ÷ 2 = 4.'},
  {t:'mc',cat:'Sequências',q:'Qual NÃO segue a regra do grupo:  3, 5, 7, 9, 11?',o:['3','5','7','9'],a:3,h:'Todos são números primos… menos um.',x:'3, 5, 7 e 11 são primos. O 9 = 3 × 3 não é primo — é o intruso.'},
  {t:'mc',cat:'Sequências',q:'Qual continua:  2, 3, 5, 8, 13, 21, …?',o:['29','32','34','36'],a:2,h:'Some os dois termos anteriores e confira.',x:'2+3=5, 3+5=8, 5+8=13, 8+13=21 e 13+21=34. É Fibonacci começando em 2.'},
  {t:'seq',cat:'Sequências',v:seqHTML(['81','27','9','3','?']),q:'Complete a sequência.',o:['0','1','2','3'],a:1,h:'Cada termo é dividido por um número constante.',x:'Dividimos por 3 a cada passo: 3 ÷ 3 = 1.'},
]},
{ id:'cls4', mod:'cls', d:3, title:'O intruso numérico', desc:'Classificando números',
  ex:[
  {t:'mc',cat:'Classificação',q:'Qual número NÃO pertence ao grupo:  4, 9, 16, 20, 25?',o:['4','9','20','25'],a:2,h:'Todos são resultado de um número multiplicado por ele mesmo… menos um.',x:'4=2², 9=3², 16=4², 25=5² são quadrados perfeitos. 20 não é — é o intruso.'},
  {t:'mc',cat:'Classificação',q:'Qual número NÃO pertence ao grupo:  10, 20, 33, 40?',o:['10','20','33','40'],a:2,h:'Todos terminam em 0… menos um.',x:'10, 20 e 40 são múltiplos de 10. O 33 não é — é o intruso.'},
  {t:'mc',cat:'Classificação',q:'Qual palavra NÃO pertence ao grupo?',o:['Azul','Vermelho','Sete','Verde'],a:2,h:'Três são cores. Qual é a exceção?',x:'Azul, vermelho e verde são cores; "sete" é um número.'},
  {t:'mc',cat:'Classificação',q:'Qual palavra NÃO pertence ao grupo?',o:['professora','médica','engenheira','colher'],a:3,h:'Três são profissões.',x:'Professora, médica e engenheira são profissões; colher é um objeto.'},
  {t:'tf',cat:'Classificação',q:'Em 2, 5, 10, 17, 26, todos os números são "um quadrado mais 1" (1²+1, 2²+1, …).',a:true,h:'Teste: 1+1, 4+1, 9+1, 16+1, 25+1…',x:'Exato: 1²+1=2, 2²+1=5, 3²+1=10, 4²+1=17, 5²+1=26. Verdadeiro!'},
]},
{ id:'ded4', mod:'ded', d:3, title:'Verdadeiros e mentirosos', desc:'Quem fala a verdade aqui?',
  ex:[
  {t:'mc',cat:'Dedução',q:'Nina declara: "Eu sou mentirosa." O que a lógica conclui sobre essa frase?',o:['Nina mente sempre','A frase cria um paradoxo','Nina fala a verdade','Nina é sincera'],a:1,h:'Se ela fala a verdade, vira mentirosa; se mente, estaria falando a verdade…',x:'Não dá para encaixar: se for verdade, ela mente; se for mentira, ela fala a verdade. É o clássico paradoxo do mentiroso.'},
  {t:'mc',cat:'Dedução',q:'Numa ilha, sinceros sempre falam a verdade e mentirosos sempre mentem. Bia diz: "Eu sou sincera." O que sabemos sobre Bia?',o:['Somente sincera','Somente mentirosa','Sincera ou mentirosa — ambos diriam isso','Nem uma nem outra'],a:2,h:'O que um mentiroso diria sobre si mesmo?',x:'Um sincero diria "sou sincera" (verdade). Um mentiroso também diria (mentira). A frase não separa os dois casos.'},
  {t:'mc',cat:'Dedução',q:'Téo diz: "Hoje é segunda." Rui diz: "Téo mente." Sabendo que hoje É segunda, quem fala a verdade?',o:['Somente Téo','Somente Rui','Os dois','Nenhum'],a:0,h:'Confira a frase de cada um contra o fato: é segunda.',x:'Téo disse a verdade (é segunda). Rui mentiu ao dizer que Téo mente. Só Téo fala a verdade.'},
  {t:'mc',cat:'Dedução',q:'Num saco há bolas vermelhas e azuis, e existem 5 vermelhas. Tirando de olhos fechados, quantas bolas para ter CERTEZA de levar pelo menos uma azul?',o:['4','5','6','7'],a:2,h:'Pense no pior caso: e se saírem todas as vermelhas primeiro?',x:'No pior caso, saem as 5 vermelhas seguidas. A 6ª bola, então, tem de ser azul. São 6.'},
  {t:'tf',cat:'Dedução',q:'Um relógio parado marcando 12:00 mostra a hora certa duas vezes por dia.',a:true,h:'Quantas vezes o dia passa pelo 12:00?',x:'O dia passa pelo 12:00 (e pela 0:00, que aparece como 12) duas vezes — e nessas duas o relógio parado acerta. Verdadeiro!'},
]},
{ id:'ord4', mod:'ord', d:3, title:'Ordem dupla', desc:'Cadeias de posição e processo',
  ex:[
  {t:'order',cat:'Ordenação',q:'Coloque os números em ordem DECRESCENTE (do maior ao menor).',items:['15','8','2'],h:'Decrescente é o contrário de crescente.',x:'15 > 8 > 2.'},
  {t:'mc',cat:'Ordenação',q:'Corrida: Ana chegou antes de Bia, e Caio chegou depois de Bia. A ordem do 1º ao 3º é:',o:['Ana, Bia, Caio','Bia, Ana, Caio','Caio, Bia, Ana','Ana, Caio, Bia'],a:0,h:'Monte a fila usando "chegou antes".',x:'Ana → Bia → Caio. Cada uma chegou antes da seguinte.'},
  {t:'order',cat:'Ordenação',q:'Organize as fases da vida de uma planta.',items:['Semente','Broto','Flor'],h:'O que precisa vir primeiro para existir o resto?',x:'Semente → broto → flor. É a ordem natural do crescimento.'},
  {t:'mc',cat:'Ordenação',q:'Na fila do cinema, Rafa está logo à frente de Nina, e Nina logo à frente de Omar. Quem está no meio?',o:['Rafa','Nina','Omar','Não dá para saber'],a:1,h:'Desenhe a fila: quem está entre os outros dois?',x:'A fila é Rafa → Nina → Omar. No meio dela está Nina.'},
  {t:'tf',cat:'Ordenação',q:'Se Dezembro vem depois de Novembro, então Novembro vem antes de Dezembro.',a:true,h:'"Antes" e "depois" são lados opostos da mesma comparação.',x:'Exato — inverter a frase não muda o fato. Verdadeiro!'},
]},
{ id:'log4', mod:'log', d:3, title:'Tabelas-verdade', desc:'Calcule os valores linha por linha',
  ex:[
  {t:'mc',cat:'Lógica',q:'p é V e q é V. Qual é o valor de "p OU q"?',o:['Verdadeiro','Falso','Indefinido','Depende de p'],a:0,h:'O OU basta uma parte verdadeira.',x:'V OU V = V. Com as duas verdadeiras, o OU não tem como ser falso.'},
  {t:'mc',cat:'Lógica',q:'p é F e q é V. Qual é o valor de "p E q"?',o:['Verdadeiro','Falso','Indefinido','Depende de q'],a:1,h:'O E exige as duas partes verdadeiras.',x:'Basta uma ser F para o E afundar: F E V = F.'},
  {t:'mc',cat:'Lógica',q:'Se p é F, qual é o valor de "NÃO p"?',o:['Verdadeiro','Falso','Indefinido','Depende do dia'],a:0,h:'A negação inverte o valor.',x:'NÃO inverte: se p é F, NÃO p é V.'},
  {t:'mc',cat:'Lógica',q:'Se "p OU q" é FALSO, o que sabemos sobre p e q?',o:['as duas são verdadeiras','p é V e q é F','as duas são falsas','p é F e q é V'],a:2,h:'Procure na tabela do OU a única linha falsa.',x:'O OU só é falso em uma linha da tabela: quando p e q são as duas falsas.'},
  {t:'tf',cat:'Lógica',q:'A tabela-verdade do operador "E" tem apenas uma linha verdadeira.',a:true,h:'Quantas combinações de V/F existem para duas variáveis?',x:'Existem 4 combinações (V-V, V-F, F-V, F-F) e só V-V dá verdadeiro. Verdadeiro!'},
]},
{ id:'log5', mod:'log', d:3, title:'Negações', desc:'Inverter frases sem mudar o sentido errado',
  ex:[
  {t:'mc',cat:'Lógica',q:'A negação de "Todos os gatos são pretos" é:',o:['Nenhum gato é preto','Todos os gatos são brancos','Pelo menos um gato não é preto','Alguns gatos são pretos'],a:2,h:'Para negar "todos", basta encontrar UM caso contrário.',x:'"Todos" cai com um único contraexemplo. A negação é "pelo menos um gato não é preto".'},
  {t:'mc',cat:'Lógica',q:'A negação de "Hoje chove OU venta" é:',o:['Não chove E não venta','Não chove OU não venta','Chove E não venta','Hoje não faz nada'],a:0,h:'O oposto de "isto ou aquilo" é "nem isto nem aquilo".',x:'Para derrubar um OU, as duas partes têm de cair: não chove E não venta. (Lei de De Morgan)'},
  {t:'mc',cat:'Lógica',q:'A negação de "Se estudo, então passo" é:',o:['Não estudo e passo','Estudo E não passo','Se não estudo, não passo','Estudo ou passo'],a:1,h:'O condicional só falha de um jeito: condição ok e consequência falha.',x:'A única linha falsa de "se…então" é condição V e consequência F: estudo e não passo.'},
  {t:'tf',cat:'Lógica',q:'A negação de "Nenhum aluno faltou" é "Pelo menos um aluno faltou".',a:true,h:'"Nenhum" e "pelo menos um" são extremos opostos.',x:'Basta um aluno faltando para "nenhum faltou" ser falso. Verdadeiro!'},
  {t:'mc',cat:'Lógica',q:'Dupla negação: "Não é verdade que João não estudou" significa:',o:['João não estudou','João estudou','Talvez João tenha estudado','João foi mal na prova'],a:1,h:'Negação de negação volta ao positivo.',x:'NÃO(NÃO estudou) = estudou. Duas negações se cancelam.'},
]},
{ id:'log7', mod:'log', d:3, title:'Silogismos', desc:'A arte de encadear verdades',
  ex:[
  {t:'mc',cat:'Lógica',q:'Todos os gatos são felinos. Todos os felinos são mamíferos. Logo, todo gato é:',o:['réptil','ave','mamífero','anfíbio'],a:2,h:'Encadeie as duas regras: gatos → felinos → ?',x:'Se todos os gatos estão dentro do grupo dos felinos, e todos os felinos dentro dos mamíferos, os gatos também estão dentro dos mamíferos. É o encadeamento clássico do silogismo.'},
  {t:'mc',cat:'Lógica',q:'Todos os pintores são artistas. Carlos é artista. Logo:',o:['Carlos é pintor','Carlos pode ou não ser pintor','Carlos não é pintor','Todos os artistas são pintores'],a:1,h:'"Todo A é B" permite inverter para "todo B é A"? Pense em artistas que não pintam.',x:'Todo pintor é artista, mas existem artistas que não pintam (músicos, atores…). Carlos pode ser pintor — ou não. Inverter uma universal é o erro mais comum da lógica.'},
  {t:'mc',cat:'Lógica',q:'Todo cientista estudou muito. Maria não é cientista. Logo:',o:['Maria não estudou muito','Maria estudou muito','Nada podemos concluir sobre o estudo de Maria','Maria é cientista'],a:2,h:'Quem mais estudou muito, além dos cientistas?',x:'Negar o antecedente não conclui nada: médicos, professores e engenheiros também estudam muito. Maria pode ter estudado muito sem ser cientista.'},
  {t:'tf',cat:'Lógica',q:'Se todas as premissas de um silogismo são verdadeiras e sua forma é válida, a conclusão é necessariamente verdadeira.',a:true,h:'É exatamente o que "validade" significa na lógica.',x:'Verdadeiro: validade garante que a conclusão decorre das premissas; se as premissas são verdadeiras, a conclusão não pode ser falsa.'},
  {t:'mc',cat:'Lógica',q:'"Alguns atletas correm rápido. Rafael corre rápido. Logo, Rafael é atleta." Qual é o erro?',o:['Nada, o raciocínio é válido','"Alguns" não garante que todo quem corre rápido é atleta','Atletas não correm rápido','O erro está em "correm rápido"'],a:1,h:'"Alguns atletas" deixa de fora muitos outros corredores rápidos.',x:'O quantificador "alguns" não permite generalizar. Corredores rápidos podem ser lebres, guepardos ou pessoas comuns. Rafael pode ser atleta — mas não é garantido.'},
]},
{ id:'eni2', mod:'eni', d:3, title:'Enigmas de lógica', desc:'Matemática disfarçada de charada',
  ex:[
  {t:'riddle',cat:'Enigmas',q:'A soma das idades de Ana e Bia é 18. Ana tem o dobro da idade de Bia. Quantos anos tem Bia?',o:['4','6','9','12'],a:1,h:'Chame a idade de Bia de B e monte a equação.',x:'B + 2B = 18 → 3B = 18 → B = 6. Ana tem 12 e Bia tem 6.'},
  {t:'riddle',cat:'Enigmas',q:'Em uma corrida, você ultrapassa o segundo colocado. Em qual posição você fica?',o:['Primeiro','Segundo','Terceiro','Último'],a:1,h:'Você não ultrapassou o primeiro…',x:'Ao ultrapassar o 2º, você assume o lugar dele: segundo — não primeiro!'},
  {t:'riddle',cat:'Enigmas',q:'Um tijolo pesa 1 kg mais meio tijolo. Quanto pesa um tijolo inteiro?',o:['1 kg','1,5 kg','2 kg','3 kg'],a:2,h:'Chame o peso do tijolo de T e traduza a frase.',x:'T = 1 + T/2 → T/2 = 1 → T = 2 kg.'},
  {t:'mc',cat:'Enigmas',q:'Todos os Blors são Trins, e todo Trin é azul. Logo, todo Blor é:',o:['azul','quadrado','vermelho','invisível'],a:0,h:'Encadeie as duas regras.',x:'É um silogismo: Blor → Trin → azul. Todo Blor é azul, sem exceção.'},
  {t:'mc',cat:'Enigmas',q:'Você tem duas moedas que somam R$ 0,60 — e uma delas NÃO é de R$ 0,50. Quais são as moedas?',o:['R$ 0,50 e R$ 0,10','R$ 0,30 e R$ 0,30','R$ 0,25 e R$ 0,35','Seis de R$ 0,10'],a:0,h:'O enunciado fala de UMA moeda específica…',x:'A pegadinha: uma moeda não é de 0,50 — a OUTRA é. As moedas são 0,50 e 0,10.'},
]},
{ id:'eni3', mod:'eni', d:3, title:'Enigmas finais', desc:'O teste definitivo da sua lógica',
  ex:[
  {t:'riddle',cat:'Enigmas',q:'Tenho cidades, mas não tenho casas; tenho montanhas, mas não tenho árvores. O que sou?',o:['O mapa','O desenho','O sonho','O livro'],a:0,h:'Onde existem cidades e montanhas juntas, sem ser na vida real?',x:'No mapa! Ele representa cidades e montanhas sem ter nenhuma de verdade.'},
  {t:'riddle',cat:'Enigmas',q:'Um fazendeiro tem 17 ovelhas. Todas menos 9 fogem. Quantas sobram?',o:['8','9','17','0'],a:1,h:'Leia "todas menos 9" letra por letra.',x:'Se todas menos 9 fogem, justamente 9 ficam. A frase já deu a resposta!'},
  {t:'riddle',cat:'Enigmas',q:'Falo todas as línguas do mundo, mas só repito o que ouço. O que sou?',o:['O tradutor','O eco','O rádio','O professor'],a:1,h:'Ele responde sempre com as suas próprias palavras…',x:'O eco! Ele "fala" qualquer língua — repetindo o que você disse.'},
  {t:'mc',cat:'Enigmas',q:'Entre 8 bolas idênticas, uma é mais pesada. Usando uma balança de dois pratos, o mínimo de pesagens para achá-la com certeza é:',o:['1','2','3','4'],a:1,h:'Divida as bolas em grupos iguais e compare os grupos.',x:'1ª pesagem: 3 contra 3 (deixando 2 de fora) — descobre o grupo pesado. 2ª: 1 contra 1. São 2 pesagens.'},
  {t:'riddle',cat:'Enigmas',q:'Quanto mais seca eu fico, mais molhada fica a mão de quem me usa. O que sou?',o:['A esponja','A toalha','A nuvem','O gelo'],a:1,h:'Ela seca alguém e, ao mesmo tempo, fica encharcada.',x:'A toalha! Quanto mais ela seca você, mais molhada ela fica.'},
]},

/* --- Extremo (9 fases) --- */
{ id:'pat6', mod:'pat', d:4, title:'Padrões de mestre', desc:'Padrões que exigem enxergar além',
  ex:[
  {t:'tf',cat:'Padrões',q:'Na sequência O, T, T, F, F, S, S, E, cada letra é a inicial de um número por extenso em inglês (One, Two, Three, Four…).',a:true,h:'Leia as letras em voz alta como iniciais.',x:'O=One, T=Two, T=Three, F=Four, F=Five, S=Six, S=Seven, E=Eight. Verdadeiro!'},
  {t:'mc',cat:'Padrões',q:'Continuando a mesma lógica — O, T, T, F, F, S, S, E, … — qual letra vem em seguida?',o:['N','T','E','O'],a:0,h:'Qual número vem depois do 8? Qual a inicial dele em inglês?',x:'Depois de Eight (8) vem Nine (9), que começa com N.'},
  {t:'mc',cat:'Padrões',q:'Quantos quadrados existem no total (de todos os tamanhos) em uma grade 3×3?',o:['9','10','13','14'],a:3,h:'Não conte só os quadradinhos: existem quadrados maiores formados por eles.',x:'Nove 1×1, quatro 2×2 e um 3×3. Total: 9 + 4 + 1 = 14.'},
  {t:'mc',cat:'Padrões',q:'Se A=1, B=2, C=3…, quanto vale a soma da palavra BOO?',o:['31','32','41','42'],a:1,h:'B=2, O=15. Some tudo.',x:'B=2, O=15, O=15 → 2 + 15 + 15 = 32.'},
  {t:'tf',cat:'Padrões',q:'Em uma grade 4×4, existem exatamente 30 quadrados de todos os tamanhos.',a:true,h:'Generalize o raciocínio da 3×3: 16 + 9 + 4 + 1.',x:'Dezesseis 1×1, nove 2×2, quatro 3×3 e um 4×4: 16 + 9 + 4 + 1 = 30. Verdadeiro!'},
]},
{ id:'seq6', mod:'seq', d:4, title:'Sequências brutais', desc:'O fim da linha para sequências',
  ex:[
  {t:'mc',cat:'Sequências',q:'Qual continua:  2, 3, 5, 9, 17, 33, …?',o:['49','57','65','66'],a:2,h:'Cada termo é o dobro do anterior… com um pequeno ajuste.',x:'A regra é "×2 e −1": 33 × 2 − 1 = 65. Confira: 17 × 2 − 1 = 33 ✓'},
  {t:'mc',cat:'Sequências',q:'Qual continua:  3, 4, 6, 8, 12, 14, 18, 20, …?',o:['21','22','23','24'],a:3,h:'Some 1 a uma sequência famosa e veja o que aparece.',x:'Cada termo é (número primo + 1): 2+1=3, 3+1=4, 5+1=6, 7+1=8, 11+1=12, 13+1=14, 17+1=18, 19+1=20, 23+1=24.'},
  {t:'seq',cat:'Sequências',v:seqHTML(['1','2','6','24','120','?']),q:'Complete a sequência.',o:['240','360','600','720'],a:3,h:'Compare cada termo com a posição dele na sequência.',x:'É o fatorial: 1!=1, 2!=2, 3!=6, 4!=24, 5!=120 e agora 6! = 720.'},
  {t:'mc',cat:'Sequências',q:'Qual continua:  1, 2, 3, 6, 7, 14, 15, …?',o:['16','30','31','29'],a:1,h:'Os saltos alternam entre duas operações.',x:'Os saltos alternam +1 e ×2: 15 × 2 = 30. Confira: 3×2=6, 6+1=7, 7×2=14, 14+1=15.'},
  {t:'riddle',cat:'Sequências',q:'Desvende:  1, 11, 21, 1211, 111221, …  Qual vem depois?',o:['222111','312211','122113','111222'],a:1,h:'Leia cada termo em voz alta, descrevendo o que você vê.',x:'É a sequência "look-and-say": 111221 se lê "três 1s, dois 2s, um 1" → 312211.'},
]},
{ id:'seq7', mod:'seq', d:4, title:'Sequências ocultas', desc:'Padrões que se escondem bem',
  ex:[
  {t:'mc',cat:'Sequências',q:'Collatz:  7, 22, 11, 34, 17, …  Qual continua?',o:['51','52','34','44'],a:1,h:'A regra alterna: número par divide por 2; número ímpar multiplica por 3 e soma 1.',x:'17 é ímpar: 17 × 3 + 1 = 52. É a famosa conjectura de Collatz — todo número testado até hoje acaba caindo no ciclo 4 → 2 → 1.'},
  {t:'mc',cat:'Sequências',q:'Quadrados espelhados:  1, 4, 9, 61, 52, …  Qual continua?',o:['63','36','76','46'],a:0,h:'Eleve cada posição ao quadrado… e leia o resultado de trás para frente.',x:'1²=1, 2²=4, 3²=9, 4²=16 invertido = 61, 5²=25 invertido = 52. O próximo é 6²=36 invertido = 63.'},
  {t:'seq',cat:'Sequências',v:seqHTML(['2','3','5','7','11','13','?']),q:'Complete a sequência.',o:['15','16','17','19'],a:2,h:'Nenhum desses números pode ser dividido por outro além de 1 e ele mesmo.',x:'São os números primos. Depois do 13 vem o 17 (14, 15 e 16 têm divisores além de 1 e deles mesmos).'},
  {t:'mc',cat:'Sequências',q:'A sequência enganosa:  1, 2, 4, 8, 16, 31, …  Por que o próximo NÃO é 32?',o:['Porque 16 não é par','Porque a dobra simples quebra: é a sequência das regiões máximas de um círculo','Porque houve erro de cálculo','Porque 31 é primo'],a:1,h:'Coloque pontos na borda de um círculo e ligue todos os pares. Conte as regiões.',x:'É o problema do círculo de Moser: o número máximo de regiões com n pontos ligados dois a dois é 1, 2, 4, 8, 16, 31… Com 6 pontos, os cruzamentos internos fazem a "dobra" quebrar — o próximo é 57.'},
  {t:'tf',cat:'Sequências',q:'Na conjectura de Collatz, todo número inteiro positivo testado até hoje eventualmente chega ao ciclo 4 → 2 → 1.',a:true,h:'Ela ainda não foi provada — mas nenhuma exceção foi encontrada.',x:'Verdadeiro. Verificaram computacionalmente até números gigantescos, e todos caem no ciclo 4→2→1. A prova geral, porém, segue em aberto — é um dos problemas famosos da matemática.'},
]},
{ id:'cls5', mod:'cls', d:4, title:'O último intruso', desc:'Intrusos com critérios escondidos',
  ex:[
  {t:'mc',cat:'Classificação',q:'Qual letra NÃO pertence ao grupo:  A, E, H, I, F?',o:['A','H','F','I'],a:2,h:'Imagine um espelho ao lado de cada letra. Quais têm simetria?',x:'A tem simetria vertical; E, horizontal; H e I, nos dois eixos. O F é a única letra do grupo sem nenhum eixo de simetria.'},
  {t:'mc',cat:'Classificação',q:'Qual número NÃO pertence:  121, 144, 169, 196, 200?',o:['121','169','196','200'],a:3,h:'Tente extrair a raiz quadrada de cada um.',x:'11²=121, 12²=144, 13²=169, 14²=196 — quadrados perfeitos consecutivos. 200 não é quadrado perfeito (14²=196 e 15²=225).'},
  {t:'mc',cat:'Classificação',q:'Duplo critério — qual NÃO pertence a  30, 33, 39, 45, 47?',o:['30','39','45','47'],a:3,h:'DOIS critérios apontam para o mesmo intruso. Some os algarismos de cada número… e teste a divisão por 3.',x:'30, 33, 39 e 45 são múltiplos de 3 (a soma dos algarismos é divisível por 3). O 47 falha nos dois testes — e ainda é o único primo do grupo.'},
  {t:'mc',cat:'Classificação',q:'Qual palavra NÃO pertence:  SOL, LUA, MAR, MÁGICA?',o:['SOL','MAR','MÁGICA','LUA'],a:2,h:'Conte as letras. Depois pense no que SOL, LUA e MAR têm em comum.',x:'SOL, LUA e MAR têm 3 letras — MÁGICA tem 6. De bônus: os três primeiros são elementos da natureza. Dois critérios, mesmo intruso.'},
  {t:'tf',cat:'Classificação',q:'Em um enigma de intruso bem construído, exatamente UM elemento quebra a regra do grupo. Se dois quebrarem, o enigma é inválido.',a:true,h:'Pense no que torna a resposta única e justa.',x:'Verdadeiro. A elegância do "ache o intruso" está na regra única do grupo e na exceção única. Dois intrusos tornam a resposta ambígua.'},
]},
{ id:'ded5', mod:'ded', d:4, title:'A matriz do detetive', desc:'Dedução com quatro pistas cruzadas',
  ex:[
  {t:'mc',cat:'Dedução',q:'Ana, Bia, Caio e Duda exercem, cada um, uma profissão: arquiteta, dentista, engenheira e professor. Bia é a professora. Ana não é dentista nem engenheira. Quem é o dentista?',o:['Ana','Bia','Caio','Duda'],a:3,h:'Comece fixando Bia. Depois, onde Ana pode estar?',x:'Bia é professora. Ana, sem poder ser dentista nem engenheira, é a arquiteta. Caio e Duda sobram com dentista e engenheira — e a pista seguinte define Caio, logo o dentista é Duda.'},
  {t:'mc',cat:'Dedução',q:'No mesmo enigma: Ana é arquiteta, Bia é professora, e Caio NÃO é o dentista. Quem é a engenheira?',o:['Ana','Caio','Duda','Bia'],a:1,h:'Sobram duas pessoas para duas profissões. Use a negação.',x:'Restaram Caio e Duda para dentista e engenheira. Como Caio não é dentista, ele é a engenheira — e Duda é o dentista.'},
  {t:'mc',cat:'Dedução',q:'Quatro casas em fila (1 a 4): verde, amarela, azul e branca. A verde não é a 1 nem a 4. A amarela é a 2. A branca não é a 1. De que cor é a casa 1?',o:['Verde','Amarela','Azul','Branca'],a:2,h:'Monte a fila eliminando posição por posição.',x:'Verde é a 3 (não pode ser 1 nem 4). Amarela é a 2. Branca, sem poder ser a 1, é a 4. Sobra a azul para a casa 1.'},
  {t:'mc',cat:'Dedução',q:'Quatro corredores: Pib chegou logo antes de Quim e logo depois de Rui. Saulo chegou em último. Quem venceu a corrida?',o:['Pib','Quim','Rui','Saulo'],a:2,h:'Encadeie "logo antes/logo depois" e prenda Saulo no fim.',x:'A sequência é Rui → Pib → Quim → Saulo. O vencedor é Rui.'},
  {t:'tf',cat:'Dedução',q:'Em uma fila de 4 pessoas com alturas todas diferentes, saber que A > B, B > C e C > D é suficiente para determinar a ordem completa.',a:true,h:'Três comparações encadeadas para quatro pessoas.',x:'A > B > C > D é a única ordem possível com essas pistas. Verdadeiro!'},
]},
{ id:'ded6', mod:'ded', d:4, title:'Dedução final', desc:'Os enigmas que fecham qualquer detetive',
  ex:[
  {t:'mc',cat:'Dedução',q:'Três caixas: "maçãs", "laranjas" e "mistas". TODAS as etiquetas estão ERRADAS. Você pode puxar UMA fruta, sem olhar, de uma caixa. Qual escolher para descobrir tudo?',o:['"maçãs"','"laranjas"','"mistas"','Qualquer uma serve'],a:2,h:'Se TODAS as etiquetas estão erradas, a caixa "mistas" não pode conter mistura. O que sobra para ela?',x:'A caixa "mistas", com etiqueta errada, contém ou só maçãs ou só laranjas. A fruta que sair revela o conteúdo dela — e, por eliminação, as outras duas caixas se resolvem, pois as etiquetas delas também estão erradas.'},
  {t:'tf',cat:'Dedução',q:'No enigma das caixas, puxar uma fruta da caixa "mistas" é suficiente para rotular as três corretamente.',a:true,h:'Uma dedução em cascata fecha as outras duas.',x:'Verdadeiro: descoberto o conteúdo real da caixa "mistas", restam dois conteúdos e duas caixas — e, como as etiquetas estão erradas, cada caixa só pode ter o conteúdo que NÃO está na própria etiqueta. Sobra uma única combinação.'},
  {t:'mc',cat:'Dedução',q:'Ana, Bia, Caio, Duda e Eva formam uma fila. Duda é o 1º. Bia está exatamente no meio. Caio está imediatamente à direita de Bia. Ana não é a 1ª nem a 5ª. Quem é o 5º?',o:['Ana','Caio','Eva','Duda'],a:2,h:'Fixe Duda (1º) e Bia (3º). Caio fica na 4ª. Onde Ana pode estar?',x:'Duda=1º, Bia=3º, Caio=4º. Ana não pode ser 1ª nem 5ª, então fica na 2ª. Sobra a 5ª posição para Eva.'},
  {t:'mc',cat:'Dedução',q:'Existe um número de 1 a 100 que é múltiplo de 3 E de 4, mas NÃO é múltiplo de 6?',o:['Sim, o 12','Sim, o 24','Não existe tal número','Existem vários'],a:2,h:'Ser múltiplo de 3 e de 4, ao mesmo tempo, significa ser múltiplo de quê?',x:'Múltiplo de 3 e de 4 = múltiplo de 12. E todo múltiplo de 12 (12, 24, 36…) é automaticamente múltiplo de 6. As pistas se contradizem: nenhuma resposta existe.'},
  {t:'mc',cat:'Dedução',q:'Enigma do chapéu: três pessoas em fila, 3 chapéus pretos e 2 brancos. A última vê os dois à frente e NÃO sabe responder. A do meio vê um e TAMBÉM não sabe. A da frente, sem ver ninguém, responde com certeza. Que chapéu ela tem?',o:['Branco, por sorte','Preto, por dedução','Branco, por eliminação','É impossível saber'],a:1,h:'Por que a última NÃO soube? Por que a do meio também não soube, sabendo do silêncio da última?',x:'Se a última visse dois brancos, saberia que a própria é preta — o silêncio dela mostra que os dois primeiros não são ambos brancos. A do meio, sabendo disso, só ficaria sem saber se visse BRANCO na frente (se visse preto, a própria seria preta). Como ela também calou, o da frente deduz: meu chapéu é preto.'},
]},
{ id:'log6', mod:'log', d:4, title:'Bicondicional', desc:'Se e somente se — a lógica dos espelhos',
  ex:[
  {t:'mc',cat:'Lógica',q:'A expressão "p ↔ q" (p se e somente se q) é verdadeira quando:',o:['p e q têm o MESMO valor','p é verdadeira','q é falsa','nunca é verdadeira'],a:0,h:'Pense em espelho: os dois lados precisam combinar.',x:'O bicondicional exige igualdade: V↔V e F↔F são verdadeiros; os pares mistos são falsos.'},
  {t:'mc',cat:'Lógica',q:'p é V e q é F. Qual é o valor de "p ↔ q"?',o:['Verdadeiro','Falso','Indefinido','Depende de p'],a:1,h:'Os valores batem?',x:'V e F têm valores opostos, então p ↔ q = F.'},
  {t:'mc',cat:'Lógica',q:'A regra era: "Você passa SE E SOMENTE SE tirar nota ≥ 7." Você tirou 9 e NÃO passou. O que concluímos?',o:['A nota 9 não é suficiente','A regra era falsa','Você reprovou por falta','Nada podemos concluir'],a:1,h:'O bicondicional trabalha nos dois sentidos: nota ≥ 7 deveria GARANTIR a aprovação.',x:'Com a condição realizada (9 ≥ 7) e a consequência negada (não passou), o "se e somente se" foi quebrado. A regra era falsa.'},
  {t:'mc',cat:'Lógica',q:'A negação de "p ↔ q" é:',o:['p e q com valores OPOSTOS','p e q com o mesmo valor','não p e não q','sempre falsa'],a:0,h:'O oposto de "iguais" é "diferentes".',x:'Negar o bicondicional dá o OU exclusivo: exatamente um dos dois é verdadeiro — valores opostos.'},
  {t:'tf',cat:'Lógica',q:'"p ↔ q" é equivalente a "(p → q) E (q → p)".',a:true,h:'"Se e somente se" junta dois condicionais.',x:'Exato: o bicondicional é a conjunção dos dois sentidos do condicional. Verdadeiro!'},
]},
{ id:'log8', mod:'log', d:4, title:'Paradoxos', desc:'Frases que a lógica não consegue engolir',
  ex:[
  {t:'mc',cat:'Lógica',q:'O barbeiro da vila barbeia todos e somente os que não se barbeiam. Quem barbeia o barbeiro?',o:['Ele mesmo','Outro barbeiro','A vila inteira','Ninguém — a regra gera um paradoxo'],a:3,h:'Se ele se barbeia, quebra a regra. Se não se barbeia, a regra o obriga a se barbear.',x:'É o paradoxo do barbeiro: se ele se barbeia, entra no grupo de quem NÃO deve ser barbeado por ele; se não se barbeia, a regra obriga a se barbear. A regra é logicamente impossível — nenhum barbeiro assim pode existir.'},
  {t:'mc',cat:'Lógica',q:'"Esta frase é falsa." O que a lógica conclui sobre ela?',o:['É só uma frase falsa comum','Cria um ciclo sem valor de verdade definido','É sempre verdadeira','Só é falsa em alguns dias'],a:1,h:'Assuma que ela é verdadeira e leia de novo. Agora assuma que é falsa.',x:'Se for verdadeira, o que ela afirma (ser falsa) deve valer — contradiz. Se for falsa, então "ser falsa" é falso, ou seja, é verdadeira — contradiz de novo. É o paradoxo do mentiroso: nenhum valor se sustenta.'},
  {t:'mc',cat:'Lógica',q:'Professor anuncia: "A prova será uma surpresa na próxima semana." Os alunos eliminam dia por dia ("não pode ser sexta, saberiam na quinta…") e concluem que a prova é impossível. A prova cai na TERÇA e surpreende a todos. Onde o raciocínio falhou?',o:['Na primeira etapa','No fim da cadeia — a última dedução pressupunha saber demais','Na segunda-feira','O professor mentiu'],a:1,h:'A cadeia de eliminações parte do fim. Para eliminar a sexta, os alunos precisariam CHEGAR na quinta sem prova — e aí já teriam adivinhado demais.',x:'É o paradoxo da prova surpresa: a eliminação da sexta assume que os alunos saberiam na quinta que a prova cairia na sexta. Voltando a cadeia, cada etapa fica mais frágil, até a conclusão "a prova é impossível" — que era exatamente o erro que permitiu a surpresa.'},
  {t:'tf',cat:'Lógica',q:'Uma afirmação é paradoxal quando leva à contradição tanto se assumida verdadeira quanto se assumida falsa.',a:true,h:'É a definição formal de paradoxo lógico.',x:'Verdadeiro. Nos dois caminhos surge contradição — como no mentiroso e no barbeiro. Por isso paradoxos não são simplesmente "falsos": são afirmações que não conseguem ter valor de verdade.'},
