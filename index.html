const GOAL = 50;
const DEFAULT_STATE = {
  name:'', avatar:'', xp:0, coins:0, coinsTotal:0, hearts:5, heartsAt:Date.now(),
  streak:0, bestStreak:0, lastDay:'', dailyDate:'', dailyDone:0, flashBest:0,
  achievements:[], progress:{}, stats:{}, flags:{ perfect:false }, view:'home',
  dayLog:{}, dailyXPLog:{}, goalDays:{}, startedAt:Date.now(),
  settings:{ sound:true, fx:true },
};
let S;
const KEY = 'wazyboo_save_v1';
function save(){ storeSet(KEY, JSON.stringify(S)); }
function load(){
  try{
    const raw = storeGet(KEY);
    S = raw ? Object.assign(deepClone(DEFAULT_STATE), JSON.parse(raw)) : deepClone(DEFAULT_STATE);
  }catch(e){ S = deepClone(DEFAULT_STATE); }
  S.settings = Object.assign({ sound:true, fx:true }, S.settings || {});
  S.flags = Object.assign({ perfect:false }, S.flags || {});
  delete S.diff;
  if (typeof S.hearts !== 'number' || isNaN(S.hearts)) S.hearts = HEART_MAX;
  if (typeof S.heartsAt !== 'number' || isNaN(S.heartsAt)) S.heartsAt = Date.now();
}
const HEART_MAX = 5, HEART_MS = 5*60*1000;
function regenHearts(){
  if (S.hearts >= HEART_MAX){ S.heartsAt = Date.now(); return; }
  const gained = Math.floor((Date.now() - S.heartsAt) / HEART_MS);
  if (gained > 0){
    S.hearts = Math.min(HEART_MAX, S.hearts + gained);
    S.heartsAt = S.hearts >= HEART_MAX ? Date.now() : S.heartsAt + gained * HEART_MS;
    save();
  }
}
function touchStreak(){
  const t = todayKey();
  S.dayLog[t] = true;
  if (S.lastDay === t) return;
  S.streak = (S.lastDay === yesterdayKey()) ? S.streak + 1 : 1;
  S.bestStreak = Math.max(S.bestStreak, S.streak);
  S.lastDay = t;
  save();
}
const todayXP = () => S.dailyXPLog[todayKey()] || 0;

/* ---------- Progresso — trilha única sequencial ---------- */
function lessonState(lesson){
  if (S.progress[lesson.id]) return 'done';
  const i = LESSONS.indexOf(lesson);
  if (i === 0) return 'open';
  return S.progress[LESSONS[i-1].id] ? 'open' : 'locked';
}
const nextLesson = () => LESSONS.find(l => lessonState(l) === 'open') || null;
const xpForLevel = l => 120 + (l-1)*90;
function levelInfo(xp){
  let l = 1, rest = xp;
  while (rest >= xpForLevel(l)){ rest -= xpForLevel(l); l++; }
  return { level:l, rest, need:xpForLevel(l) };
}
function currentDiff(){
  const nl = nextLesson();
  return diffOf(nl ? nl.d : LESSONS[LESSONS.length-1].d);
}
function weekHTML(size = 36){
  const names = ['dom','seg','ter','qua','qui','sex','sáb'];
  let out = '';
  for (let i = 6; i >= 0; i--){
    const d = new Date(Date.now() - i*864e5);
    const on = !!S.dayLog[dkey(d)];
    out += `<div class="wday">
      <span class="wdot ${on ? 'on' : ''}" style="width:${size}px;height:${size}px">${on ? icon('check', size > 36 ? 17 : 14) : ''}</span>
      <span class="wlab">${names[d.getDay()]}</span>
    </div>`;
  }
  return `<div class="week-row">${out}</div>`;
}

/* ---------- Foto de perfil ---------- */
const avatarHTML = (size) => S.avatar
  ? `<span class="avatar" style="width:${size}px;height:${size}px"><img src="${S.avatar}" alt="Sua foto de perfil"></span>`
  : `<span class="avatar av-fb" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.42)}px">${esc((S.name||'W')[0].toUpperCase())}</span>`;
function setAvatarFromFile(file){
  if (!file) return;
  if (!file.type.startsWith('image/')){ toast('Escolha um arquivo de imagem', 'x'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const SZ = 160;
      const c = document.createElement('canvas');
      c.width = SZ; c.height = SZ;
      const g = c.getContext('2d');
      const s = Math.min(img.width, img.height);
      g.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, SZ, SZ);
      S.avatar = c.toDataURL('image/jpeg', 0.85);
      save(); render();
      toast('Foto de perfil atualizada!', 'check', true);
    };
    img.onerror = () => toast('Não consegui ler essa imagem', 'x');
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function toast(msg, ico = 'sparkle', gold = false){

  t.className = 'toast' + (gold ? ' gold' : '');
  t.innerHTML = icon(ico, 18) + `<span>${msg}</span>`;

}
const cv = $('#confetti'), cx2 = cv.getContext('2d');
let parts = [], confRAF = null;
function sizeCv(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', sizeCv); sizeCv();
function confetti(n = 90){
  if (!S.settings || !S.settings.fx) return;
  const cols = ['#8B5CF6','#A78BFA','#FFC800','#FF4B4B','#1CB0F6'];
  for (let i = 0; i < n; i++) parts.push({
    x: innerWidth*(0.2+Math.random()*0.6), y: -12-Math.random()*60,
    vx: (Math.random()-0.5)*4, vy: 2+Math.random()*3.5, rot: Math.random()*Math.PI,
    vr: (Math.random()-0.5)*0.25, s: 5+Math.random()*6, c: cols[Math.floor(Math.random()*cols.length)],
    rect: Math.random() > .4,
  });
  if (!confRAF) confLoop();
}
function confLoop(){
  cx2.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p => p.y < innerHeight + 30);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.rot += p.vr;
    cx2.save(); cx2.translate(p.x,p.y); cx2.rotate(p.rot); cx2.fillStyle = p.c;
    if (p.rect) cx2.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);
    else { cx2.beginPath(); cx2.arc(0,0,p.s/2,0,7); cx2.fill(); }
    cx2.restore();
  });
  confRAF = parts.length ? requestAnimationFrame(confLoop) : null;
}
function floatXP(text){
  const anchor = document.querySelector('.pill.xp');
  const r = anchor && anchor.getBoundingClientRect();
  const visible = r && r.width > 0;
  const el = document.createElement('div');
  el.className = 'float-xp'; el.textContent = text;
  el.style.left = visible ? r.left + 'px' : Math.max(10, innerWidth/2 - 30) + 'px';
  el.style.top = visible ? (r.bottom + 8) + 'px' : '110px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1150);
}
function openModal(html, dismissable = true){
  const root = $('#modal-root');
  root.innerHTML = `<div class="overlay"><div class="modal">${html}</div></div>`;
  const ov = root.querySelector('.overlay');
  if (dismissable) ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  return root.querySelector('.modal');
}
const closeModal = () => { $('#modal-root').innerHTML = ''; };

/* ================================================================
   GAMIFICAÇÃO
   ================================================================ */
function addXP(n){
  const before = levelInfo(S.xp).level;
  S.xp += n;
  touchStreak();
  const t = todayKey();
  const prevXP = S.dailyXPLog[t] || 0;
  S.dailyXPLog[t] = prevXP + n;
  if (prevXP < GOAL && S.dailyXPLog[t] >= GOAL && !S.goalDays[t]){
    S.goalDays[t] = true;
    setTimeout(() => { toast('Meta diária concluída! ' + GOAL + ' XP batidos', 'target', true); confetti(70); }, 400);
  }
  floatXP('+' + n + ' XP');
  const after = levelInfo(S.xp).level;
  save(); renderTop();
  if (after > before){ levelUpModal(after); playSound('win'); }
}
function addCoins(n, silent){
  S.coins += n; S.coinsTotal += n;
  if (!silent){ toast(`+${n} moedas`, 'coin', true); playSound('coin'); }
  save(); renderTop();
}
function checkAchievements(){
  ACHIEVEMENTS.forEach(a => {
    if (!S.achievements.includes(a.id) && a.cond()){

      const m = openModal(`
        <div class="scene-center">${booScene('medalha')}</div>

          <button class="btn purple" id="achOk">Continuar</button>
        </div>`);
      m.querySelector('#achOk').onclick = closeModal;
      confetti(70);
    }
  });
}

}

/* ================================================================

let run = null, flashTimer = null;
function stopFlashTimer(){ if (flashTimer){ clearInterval(flashTimer); flashTimer = null; } }
const okTitles = ['Boa!','É isso!','Mandou bem!','Exato!','Perfeito!'];
const badTitles = ['Quase!','Não foi dessa vez','Boa tentativa!'];
const lvMult = lv => 8 + lv*2;
function exerciseXP(){
  const lv = run.lesson.mod ? (MODULES.find(m=>m.id===run.lesson.mod)||{lv:1}).lv : 2;
  const mult = diffOf(run.lesson.d || 1).mult;
  return Math.round(lvMult(lv) * mult);
}

function makePracticeLesson(cat){
  const pool = LESSONS.filter(l => S.progress[l.id] || lessonState(l) !== 'locked')
    .flatMap(l => l.ex.filter(e => e.cat === cat));
  const finalPool = pool.length >= 5 ? pool : LESSONS.flatMap(l => l.ex.filter(e => e.cat === cat));
  return { id:'practice', mod:null, d:2, title:'Prática focada — ' + cat, desc:'Reforço inteligente', ex:shuffle(finalPool).slice(0,5), pseudo:true };
}
function makeDailyLesson(){
  const rng = seededRng('wz-' + todayKey());
  const pool = LESSONS.flatMap(l => l.ex);
  const chosen = []; const used = new Set();
  while (chosen.length < 6 && used.size < pool.length){
    const e = pickSeed(pool, rng);
    if (!used.has(e)){ used.add(e); chosen.push(e); }
  }
  return { id:'daily', mod:null, d:2, title:'Desafio diário', desc:'6 questões sorteadas para hoje', ex:chosen, pseudo:true };
}
function startRun(lesson, mode){
  run = { mode, lesson, idx:0, hits:0, misses:0, xp:0, wrongNow:false, answered:false };
  S.view = 'lesson'; render();
}
function quitRun(){ stopFlashTimer(); run = null; S.view = 'learn'; render(); }

function renderRunScreen(){
  const app = $('#app');
  const total = run.lesson.ex.length;
  const useHearts = run.mode === 'lesson' || run.mode === 'daily';
  app.innerHTML = `
  <div class="lesson-shell view-enter">
    <div class="qtop">
      <button class="xbtn" id="lquit" aria-label="Sair da lição">${icon('x',22)}</button>
      <div class="qprog progress"><i style="width:${run.idx/total*100}%"></i></div>
      ${useHearts ? `<span class="qhp">${icon('heart',18)} ${S.hearts}</span>` : ''}
    </div>
    <div id="qzone"></div>
  </div>`;
  $('#lquit').onclick = () => {
    const m = openModal(`
      <h2>Sair da lição?</h2><p>Seu progresso nesta lição será perdido. O Wazyboo vai sentir sua falta!</p>
      <button class="btn purple" id="stay">Continuar aqui</button>
      <button class="btn ghost" id="leave">Sair mesmo assim</button>`);
    m.querySelector('#stay').onclick = closeModal;
    m.querySelector('#leave').onclick = () => { closeModal(); quitRun(); toast('Lição abandonada — sem perda de XP!', 'flag'); };
  };
  renderQuestion();
}

let exState = null;
function renderQuestion(){
  run.answered = false; run.wrongNow = false;
  const ex = run.lesson.ex[run.idx];
  const zone = $('#qzone');
  const df = diffOf(run.lesson.d || 1);
  const tag = `<div class="q-tag">${esc(ex.cat || run.lesson.title)} <span class="diff-tag" style="background:${df.col}">${df.name}</span></div>`;
  const qtxt = `<div class="q-text">${ex.q}</div>`;
  let body = '';
  exState = {};

  if (ex.t === 'mc' || ex.t === 'riddle' || ex.t === 'seq'){
    const opts = ex.o.map((o, i) => `<button class="opt" data-i="${i}" style="animation-delay:${i*50}ms">${o}</button>`).join('');
    body = `${ex.t==='riddle' ? `<div class="riddle-box">${ex.q}</div>` : ex.v ? `<div class="q-visual">${ex.v}</div>${qtxt}` : qtxt}
      <div class="opts ${ex.o.every(o => String(o).length < 12) ? 'two' : ''}">${opts}</div>`;
    zone.innerHTML = `<div class="q-card">${tag}${body}</div><div class="l-footer"><button class="btn purple" id="btnCheck" disabled>Verificar</button></div>`;
    zone.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (run.answered) return;
      zone.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel'); exState.pick = +b.dataset.i;
      $('#btnCheck').disabled = false;
    });
  }
  else if (ex.t === 'tf'){
    body = `<div class="q-text">${ex.q}</div>
      <div class="opts two tf-row">
        <button class="opt" data-v="true"><span class="big">${icon('check',22)}</span> Verdadeiro</button>
        <button class="opt" data-v="false"><span class="big">${icon('x',22)}</span> Falso</button>
      </div>`;
    zone.innerHTML = `<div class="q-card">${tag}${body}</div><div class="l-footer"><button class="btn purple" id="btnCheck" disabled>Verificar</button></div>`;
    zone.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (run.answered) return;
      zone.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel'); exState.pick = b.dataset.v === 'true';
      $('#btnCheck').disabled = false;
    });
  }
  else if (ex.t === 'match'){
    const right = shuffle(ex.pairs.map((p, i) => ({ txt:p[1], src:i })));
    const PAIRCOLS = ['#8B5CF6','#FFC800','#FF4B4B'];
    exState.pairs = {}; exState.sel = null; exState.cols = PAIRCOLS;
    zone.innerHTML = `<div class="q-card">${tag}${qtxt}
      <div class="match-wrap">
        <div class="match-col" id="mL">${ex.pairs.map((p,i)=>`<button class="mitem" data-l="${i}">${p[0]}</button>`).join('')}</div>
        <div class="match-col" id="mR">${right.map(r=>`<button class="mitem" data-r="${r.src}">${r.txt}</button>`).join('')}</div>
      </div>
      <div class="match-hint">Toque em um item da esquerda e depois no seu par da direita</div>
    </div><div class="l-footer"><button class="btn purple" id="btnCheck" disabled>Verificar</button></div>`;
    const paint = () => {
      zone.querySelectorAll('#mL .mitem').forEach(b => {
        const l = +b.dataset.l;
        b.classList.toggle('sel', exState.sel === l);
        b.classList.toggle('paired', exState.pairs[l] != null);
        b.innerHTML = exState.pairs[l] != null
          ? `<span><span class="pairdot" style="background:${exState.cols[Object.keys(exState.pairs).indexOf(String(l))%3]}"></span>${ex.pairs[l][0]}</span>`
          : ex.pairs[l][0];
      });
      zone.querySelectorAll('#mR .mitem').forEach(b => b.classList.toggle('dim', Object.values(exState.pairs).includes(+b.dataset.r)));
      $('#btnCheck').disabled = Object.keys(exState.pairs).length < ex.pairs.length;
    };
    zone.querySelectorAll('#mL .mitem').forEach(b => b.onclick = () => {
      const l = +b.dataset.l;
      if (exState.pairs[l] != null){ delete exState.pairs[l]; exState.sel = null; paint(); return; }
      exState.sel = (exState.sel === l) ? null : l; paint();
    });
    zone.querySelectorAll('#mR .mitem').forEach(b => b.onclick = () => {
      const r = +b.dataset.r;
      if (Object.values(exState.pairs).includes(r) || exState.sel == null) return;
      exState.pairs[exState.sel] = r; exState.sel = null; paint();
    });
    paint();
  }
  else if (ex.t === 'order'){
    const items = ex.items.map((txt, i) => ({ txt, id:i }));
    exState.bank = shuffle(items); exState.slots = Array(items.length).fill(null); exState.selCard = null;
    zone.innerHTML = `<div class="q-card">${tag}${qtxt}
      <div class="drag-hint">Arraste os cartões — ou toque para selecionar e toque no espaço</div>
      <div class="order-slots" id="oSlots">${items.map((_,i)=>`<div class="oslot" data-s="${i}"><span class="num">${i+1}</span><span class="ph" style="color:var(--faint)">solte aqui</span></div>`).join('')}</div>
      <div class="order-bank" id="oBank"></div>
    </div><div class="l-footer"><button class="btn purple" id="btnCheck" disabled>Verificar</button></div>`;
    const slotEl = s => zone.querySelector(`.oslot[data-s="${s}"]`);
    function paintOrder(){
      const bank = $('#oBank');
      bank.innerHTML = '';
      exState.bank.forEach(c => {
        const d = document.createElement('button');
        d.className = 'ocard' + (exState.selCard === ('b'+c.id) ? ' sel' : '');
        d.dataset.k = 'b'+c.id; d.innerHTML = c.txt;
        bank.appendChild(d);
      });
      exState.slots.forEach((c, i) => {
        const el = slotEl(i);
        el.classList.toggle('filled', !!c);
        el.innerHTML = `<span class="num">${i+1}</span>` + (c ? `<span class="ocard" data-k="s${c.id}" style="border:none;padding:0;background:none">${c.txt}</span>` : `<span class="ph" style="color:var(--faint)">solte aqui</span>`);
      });
      $('#btnCheck').disabled = exState.bank.length > 0;
      bindDrag();
    }
    function findCard(k){
      if (k[0] === 'b'){ const id = +k.slice(1); const c = exState.bank.find(x => x.id === id); return c ? { c, from:'bank' } : null; }
      const id = +k.slice(1); const s = exState.slots.findIndex(x => x && x.id === id);
      return s >= 0 ? { c: exState.slots[s], from:'slot', s } : null;
    }
    function place(card, from, slotIdx){
      if (from === 'slot') exState.slots[from.s] = null;
      else exState.bank = exState.bank.filter(x => x.id !== card.id);
      const occupant = exState.slots[slotIdx];
      exState.slots[slotIdx] = card;
      if (occupant) exState.bank.push(occupant);
      exState.selCard = null; paintOrder();
    }
    function tapLogic(k){
      const found = findCard(k); if (!found) return;
      if (exState.selCard === k){ exState.selCard = null; paintOrder(); return; }
      if (found.from === 'bank' && exState.selCard && exState.selCard[0] === 's'){
        const inSlot = findCard(exState.selCard);
        exState.slots[inSlot.s] = null;
        exState.bank.push(inSlot.c);
        exState.selCard = k; paintOrder(); return;
      }
      exState.selCard = k; paintOrder();
    }
    function bindDrag(){
      zone.querySelectorAll('.ocard').forEach(d => {
        let moved = false;
        d.onclick = () => {
          if (moved){ moved = false; return; }
          if (!run.answered) tapLogic(d.dataset.k);
        };
        d.onpointerdown = e => {
          if (run.answered) return;
          e.preventDefault();
          moved = false;
          const startX = e.clientX, startY = e.clientY;
          const found = findCard(d.dataset.k); if (!found) return;
          const ghost = d.cloneNode(true); ghost.classList.add('ghost');
          document.body.appendChild(ghost);
          d.classList.add('dragging');
          const move = ev => {
            if (Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY) > 8) moved = true;
            ghost.style.left = (ev.clientX - 30) + 'px'; ghost.style.top = (ev.clientY - 24) + 'px';
            zone.querySelectorAll('.oslot').forEach(s => s.classList.remove('over'));
            const el = document.elementFromPoint(ev.clientX, ev.clientY);
            const slot = el && el.closest && el.closest('.oslot');
            if (slot) slot.classList.add('over');
          };
          move(e);
          const up = ev => {
            document.removeEventListener('pointermove', move);
            document.removeEventListener('pointerup', up);
            ghost.remove(); d.classList.remove('dragging');
            zone.querySelectorAll('.oslot').forEach(s => s.classList.remove('over'));
            const el = document.elementFromPoint(ev.clientX, ev.clientY);
            const slot = el && el.closest && el.closest('.oslot');
            if (slot){
              const si = +slot.dataset.s;
              const cur = exState.slots[si];
              if (cur){ exState.slots[si] = null; exState.bank.push(cur); }
              place(found.c, found.from, si);
            } else paintOrder();
          };
          document.addEventListener('pointermove', move);
          document.addEventListener('pointerup', up);
        };
      });
      zone.querySelectorAll('.oslot').forEach(s => s.onclick = () => {
        if (run.answered) return;
        const si = +s.dataset.s;
        if (exState.selCard){
          const found = findCard(exState.selCard);
          if (found) place(found.c, found.from, si);
        } else if (exState.slots[si]){
          exState.bank.push(exState.slots[si]); exState.slots[si] = null; paintOrder();
        }
      });
    }
    paintOrder();
  }
  $('#btnCheck').onclick = checkAnswer;
  window.scrollTo({ top:0, behavior:'smooth' });
}

function checkAnswer(){
  if (run.answered) return;
  const ex = run.lesson.ex[run.idx];
  let ok = false;
  if (ex.t === 'mc' || ex.t === 'riddle' || ex.t === 'seq') ok = exState.pick === ex.a;
  else if (ex.t === 'tf') ok = exState.pick === ex.a;
  else if (ex.t === 'match') ok = ex.pairs.every((p, i) => exState.pairs[i] === i);
  else if (ex.t === 'order') ok = exState.slots.every((c, i) => c && c.id === i);
  run.answered = true; run.wrongNow = !ok;

  const cat = ex.cat || 'Geral';
  S.stats[cat] = S.stats[cat] || { c:0, t:0 };
  S.stats[cat].t++;

  const zone = $('#qzone');
  if (ok){
    run.hits++; S.stats[cat].c++;
    const xp = exerciseXP(); run.xp += xp;
    if (ex.t === 'tf'){
      zone.querySelectorAll('.tf-row .opt').forEach(b => {
        if ((b.dataset.v === 'true') === ex.a) b.classList.add('right');
      });
    } else {
      zone.querySelectorAll('.opt').forEach(b => { if (b.dataset.i !== undefined && +b.dataset.i === ex.a) b.classList.add('right'); });
    }
    addXP(xp);
  } else {
    run.misses++;
    if (run.mode === 'lesson' || run.mode === 'daily'){
      const wasFull = S.hearts === HEART_MAX;
      S.hearts = Math.max(0, S.hearts - 1);
      if (wasFull) S.heartsAt = Date.now();
    }
  }
  save(); renderTop();

  if (run.mode === 'flash'){ if (ok) playSound('ok'); else playSound('bad'); return; }
  showFeedback(ok, ex);
}

function showFeedback(ok, ex){
  playSound(ok ? 'ok' : 'bad');
  const sheet = $('#sheet');
  const title = ok ? okTitles[Math.floor(Math.random()*okTitles.length)] : badTitles[Math.floor(Math.random()*badTitles.length)];
  const hintHTML = (!ok && ex.h) ? `<div class="sheet-hint">${icon('bulb',17)}<span><b>Dica:</b> ${ex.h}</span></div>` : '';
  sheet.innerHTML = `<div class="sheet-in"><div class="sheet-card ${ok ? 'ok' : 'bad'}">
    <div class="sheet-flex">
      ${booScene(ok ? 'feliz' : 'triste', 'sm')}
      <div style="flex:1">
        <div class="sheet-title">${title}${ok ? ` &nbsp;+${exerciseXP()} XP` : ''}</div>
        <div class="sheet-body">${ex.x}</div>
        ${hintHTML}
        <button class="sheet-btn" id="sheetNext">${run.idx === run.lesson.ex.length-1 ? 'Finalizar' : 'Continuar'}</button>
      </div>

}

function finishRun(){

    const prev = S.progress[run.lesson.id];

    S.progress[run.lesson.id] = { stars: Math.max(prev ? prev.stars : 0, stars), best: Math.max(prev ? prev.best : 0, acc) };
    const coins = firstTime ? 15 : 5;
    addCoins(coins, true);

  const titles = { lesson:'Lição completa!', daily:'Desafio diário concluído!', practice:'Prática concluída!' };

  const df = diffOf(run.lesson.d || 1);

    save();
    upBanner = `<div class="reward-list"><div class="r">${icon('crown',18)} Nova dificuldade desbloqueada: <b style="color:${ndf.col}">${ndf.name}</b> — XP ×${ndf.mult}!</div></div>`;
  }
  const app = $('#app');
  app.innerHTML = `
  <div class="lesson-shell view-enter">
    <div class="result-hero">
      <div class="scene-center" style="margin-bottom:2px">${booScene(scene)}</div>
      <h1 class="ptitle" style="margin-top:4px">${titles[run.mode] || 'Concluído!'}</h1>
      <p class="sub">${esc(run.lesson.title)} <span class="diff-tag" style="background:${df.col}">${df.name}</span> · ${acc}% de acerto</p>
      <div class="stars-row">${[1,2,3].map(i => `<span class="st ${i <= stars ? 'on' : ''}">${icon('star',44)}</span>`).join('')}</div>
    </div>
    <div class="res-stats">
      <div class="stat-box pb"><div class="v">+${run.xp}</div><div class="k">XP total</div></div>
      <div class="stat-box pb"><div class="v">${run.hits}</div><div class="k">Acertos</div></div>
      <div class="stat-box rb"><div class="v">${run.misses}</div><div class="k">Erros</div></div>
    </div>
    ${upBanner}

    <div style="display:grid; gap:10px; max-width:380px; margin:0 auto">
      <button class="btn purple" id="resGo">${icon('check',18)} Continuar</button>
      ${run.mode === 'lesson' ? '<button class="btn ghost" id="resAgain">' + icon('refresh',16) + ' Repetir lição</button>' : ''}
    </div>
  </div>`;
  confetti(140);
  app.querySelector('#resGo').onclick = () => { const was = run; run = null; S.view = was.mode === 'lesson' ? 'learn' : 'home'; render(); };
  const ag = app.querySelector('#resAgain');
  if (ag) ag.onclick = () => startRun(LESSONS.find(l => l.id === run.lesson.id), 'lesson');
}

/* ================================================================

   ================================================================ */
function genFlashQ(){
  const kinds = ['add','sub','double','fib','alt'];
  const kind = kinds[Math.floor(Math.random()*kinds.length)];
  let seq = [], ans, rule = '';
  const r = n => Math.floor(Math.random()*n);
  if (kind === 'add'){ const s = 2+r(8), k = 2+r(6); for(let i=0;i<5;i++) seq.push(s+i*k); ans = s+5*k; rule = 'some '+k; }
  else if (kind === 'sub'){ const s = 30+r(40), k = 2+r(6); for(let i=0;i<5;i++) seq.push(s-i*k); ans = s-5*k; rule = 'subtraia '+k; }
  else if (kind === 'double'){ const s = 1+r(4); for(let i=0;i<5;i++) seq.push(s*Math.pow(2,i)); ans = s*32; rule = 'dobrou'; }
  else if (kind === 'fib'){ const a = r(3), b = a+1+r(3); seq = [a,b]; for(let i=2;i<6;i++) seq.push(seq[i-1]+seq[i-2]); ans = seq.pop(); rule = 'somou os dois anteriores'; }
  else { const s = r(5), k = 1+r(4); seq = [s, s+k, s+k, s+2*k, s+2*k]; ans = s+3*k; rule = 'repetiu e somou '+k; }
  const opts = new Set([ans]);
  while (opts.size < 4){ const d = ans + (Math.random()>.5?1:-1)*(1+Math.floor(Math.random()*4)); if (d > 0) opts.add(d); }
  const arr = shuffle([...opts]);
  return { o:arr.map(String), a:arr.indexOf(ans), v:seqHTML([...seq.map(String),'?']), q:'Qual número continua a sequência?' };
}
function startFlash(){
  run = { mode:'flash', lesson:{ id:'flash', title:'Contra o Relógio', d:2, pseudo:true, ex:[] }, idx:0, hits:0, misses:0, xp:0, flashScore:0, flashLeft:60 };
  S.view = 'flash'; render();
  const app = $('#app');
  app.innerHTML = `
  <div class="lesson-shell view-enter">
    <div class="f-top">
      <div class="fleft">
        <button class="xbtn" id="fquit" aria-label="Sair do Contra o Relógio">${icon('x',20)}</button>
        <span>Contra o Relógio · 60s</span>
      </div>
      <span class="sc">${icon('zap',20)} <span id="flashScore">0</span></span>
    </div>
    <div class="timer-bar"><i id="flashBar" style="width:100%"></i></div>
    <div id="qzone"></div>
  </div>`;
  $('#fquit').onclick = () => {
    if (run.flashScore > 0){ endFlash(); }
    else { stopFlashTimer(); run = null; S.view = 'challenges'; save(); render(); toast('Relâmpago encerrado', 'clock'); }
  };
  const paintTimer = () => {
    const bar = $('#flashBar'); if (!bar) return;
    bar.style.width = (run.flashLeft/60*100) + '%';
    bar.style.background = run.flashLeft < 15 ? 'var(--r1)' : 'var(--y1)';
  };
  const nextQ = () => {
    const q = genFlashQ();
    run.answered = false;
    const zone = $('#qzone');
    if (!zone) return;
    zone.innerHTML = `<div class="q-card"><div class="q-visual" style="margin-bottom:16px">${q.v}</div>
      <div class="opts two">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div></div>`;
    zone.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (run.answered) return;
      run.answered = true;
      const okRun = +b.dataset.i === q.a;
      b.classList.add(okRun ? 'right' : 'wrong');
      if (!okRun) zone.querySelector(`.opt[data-i="${q.a}"]`).classList.add('right');
      S.stats['Revisão'] = S.stats['Revisão'] || { c:0, t:0 };
      S.stats['Revisão'].t++;
      if (okRun){
        run.flashScore++; run.hits++;
        S.stats['Revisão'].c++;
        addXP(8);
        const sc = $('#flashScore'); if (sc) sc.textContent = run.flashScore;
      } else run.misses++;
      save();
      setTimeout(() => { if (run && run.mode === 'flash') nextQ(); }, 430);
    });
  };
  nextQ(); paintTimer();
  stopFlashTimer();
  flashTimer = setInterval(() => {
    if (!run || run.mode !== 'flash'){ stopFlashTimer(); return; }
    run.flashLeft -= 0.25; paintTimer();
    if (run.flashLeft <= 0) endFlash();
  }, 250);
}
function endFlash(){
  stopFlashTimer();
  if (!run || run.mode !== 'flash') return;
  const score = run.flashScore;
  const isRecord = score > S.flashBest;
  if (isRecord) S.flashBest = score;
  const coins = score * 2;
  S.coins += coins; S.coinsTotal += coins;
  run = null;
  S.view = 'challenges';
  touchStreak(); save(); checkAchievements(); renderTop();
  if (score > 0) playSound('win');
  const app = $('#app');
  app.innerHTML = `
  <div class="lesson-shell view-enter">
    <div class="result-hero">
      <div class="scene-center">${booScene('relampago')}</div>
      <div class="flash-score-big" style="margin-top:2px">${score}</div>
      <p class="sub">acertos em 60 segundos ${isRecord ? '· <b style="color:var(--selT)">novo recorde!</b>' : '· recorde: ' + S.flashBest}</p>
    </div>
    <div style="display:grid; gap:10px; max-width:380px; margin:16px auto 0">
      <div class="reward-list" style="margin:0"><div class="r">${icon('coin',18)} Moedas ganhas <b>+${coins}</b></div></div>
      <button class="btn purple" id="flAgain">${icon('refresh',16)} Jogar de novo</button>
      <button class="btn ghost" id="flBack">Voltar aos desafios</button>
    </div>
  </div>`;
  if (score > 0) confetti(120);
  app.querySelector('#flAgain').onclick = startFlash;
  app.querySelector('#flBack').onclick = () => render();
}

const catAcc = cat => { const s = S.stats[cat]; return s && s.t > 0 ? s.c / s.t : null; };
function adaptiveAdvice(){
  const cats = Object.keys(S.stats).filter(c => S.stats[c].t >= 4);
  if (!cats.length) return { type:'start', text:'A trilha começa fácil e vai dificultando a cada fase. O primeiro passo te espera!', cat:null };
  const ranked = cats.map(c => ({ c, acc: S.stats[c].c / S.stats[c].t })).sort((a, b) => b.acc - a.acc);
  const best = ranked[0], worst = ranked[ranked.length-1];
  if (best.acc >= 0.8 && best.c !== worst.c)
    return { type:'good', text:`Você está indo muito bem em ${best.c.toLowerCase()} — ${Math.round(best.acc*100)}% de acerto! Continue avançando na trilha.`, cat:null };
  if (worst.acc < 0.7)
    return { type:'train', text:`Que tal praticar um pouco mais de ${worst.c.toLowerCase()}? Seu acerto está em ${Math.round(worst.acc*100)}% — tenho 5 questões perfeitas para você.`, cat:worst.c };
  return { type:'ok', text:'Seu desempenho está equilibrado. Siga firme — a trilha fica cada vez mais desafiadora!', cat:null };
}

/* ---------- APRENDER — trilha única, sem repetição ---------- */
function viewLearn(){
  const wide = window.matchMedia('(min-width:1024px)').matches;
  const PW = wide ? 480 : 340;
  const OFF = wide ? [0,-60,-100,-60,0,60,100,60] : [0,-50,-85,-50,0,50,85,50];
  const STEP = 116, HEADH = 56, HEADGAP = 36, BANH = 90, PAD = 70, C = PW / 2;
  const doneTotal = doneCount();
  const cd = currentDiff();
  let y = PAD, rowsHtml = '', pts = [];
  const headsDone = new Set();
  let lastD = 0;
  LESSONS.forEach((l, i) => {
    if (l.d !== lastD){
      lastD = l.d;
      const df = diffOf(l.d);
      rowsHtml += `<div class="trail-banner" style="top:${y}px;background:linear-gradient(135deg, ${df.col}, ${df.colD})">
        <div class="tb-ico">${icon(df.n === 4 ? 'crown' : 'zap',22)}</div>
        <div class="grow"><b>Dificuldade ${df.name}</b>
        <div class="p-sub">${df.desc} · XP ×${df.mult} por acerto</div></div>
      </div>`;
      y += BANH;
    }
    const mod = MODULES.find(m => m.id === l.mod);
    if (!headsDone.has(mod.id)){
      headsDone.add(mod.id);
      const L = LEVELS.find(v => v.n === mod.lv);
      rowsHtml += `<div class="uhead" style="top:${y}px;background:${mod.col};box-shadow:0 5px 0 ${mod.colD}">
        <b>${mod.title}</b><small>Nv ${mod.lv} · ${L.name}</small></div>`;
      y += HEADH + HEADGAP;
    }
    const st = lessonState(l);
    const x = C + OFF[i % OFF.length];
    pts.push({ x, y: y + 35, st });
    const ic = st === 'locked' ? 'lock' : st === 'done' ? (S.progress[l.id].stars >= 3 ? 'crown' : 'check') : 'star';
    rowsHtml += `<button class="pnode ${st}${st==='done' && S.progress[l.id].stars >= 3 ? ' legend' : ''}"
      data-l="${l.id}" style="left:${x-35}px;top:${y}px"
      data-tip="Fase ${i+1} · ${esc(mod.title)} · ${esc(l.title)}"><span class="nic">${icon(ic,26)}</span></button>`;
    y += STEP;
  });
  let d = '';
  pts.forEach((p, k) => {
    if (k === 0){ d = `M ${p.x} ${p.y}`; return; }
    const my = (pts[k-1].y + p.y) / 2;
    d += ` C ${pts[k-1].x} ${my}, ${p.x} ${my}, ${p.x} ${p.y}`;
  });
  const curIdx = pts.findIndex(p => p.st === 'open');
  const bub = curIdx >= 0 ? `<div class="start-bub" style="left:${pts[curIdx].x}px;top:${pts[curIdx].y - 70}px">FASE ${curIdx+1}</div>` : '';
  const pctAll = Math.round(doneTotal / LESSONS.length * 100);
  return `<div class="view-enter">
    <h1 class="ptitle">${S.name ? 'Vamos, ' + esc(S.name) + '!' : 'Vamos aprender!'}</h1>
    <p class="sub">${LESSONS.length} fases únicas, do fácil ao extremo — cada uma ensina algo novo e libera a próxima.</p>
    <div class="trail-banner standalone" style="background:linear-gradient(135deg, ${cd.col}, ${cd.colD})">
      <div class="tb-ico">${icon('zap',22)}</div>
      <div class="grow">
        <b>Agora: dificuldade ${cd.name}</b>
        <div class="p-sub">${cd.desc} · ${doneTotal} de ${LESSONS.length} fases concluídas (${pctAll}%) · XP ×${cd.mult}</div>
        <div class="progress"><i style="width:${pctAll}%"></i></div>
      </div>
    </div>
    <div class="path" style="height:${y}px;width:${PW}px">
      <svg class="trail-line" width="${PW}" height="${y}" viewBox="0 0 ${PW} ${y}" fill="none">
        <path d="${d}" stroke="var(--line)" stroke-width="13" stroke-linecap="round"/>
      </svg>
      ${rowsHtml}${bub}
    </div></div>`;
}

    <p class="sub">A posição sobe com o XP total. Fases mais difíceis rendem XP mais rápido.</p>
    <div class="card panel" style="margin-top:16px;display:flex;align-items:center;gap:14px">
      <div style="width:52px;height:52px;border-radius:50%;background:${league.c};display:grid;place-items:center;color:#3C3C3C;flex:none">${icon(league.n === 'Ouro' ? 'crown' : 'medal',26)}</div>
      <div><div style="font-weight:900;font-size:17px">Liga ${league.n}</div>
      <div class="p-sub">Você está em ${myPos}º com ${S.xp} XP — nível ${li.level}</div></div>
    </div>
    <div class="lb" style="margin-top:12px">
      ${rows.map((r, i) => `
      <div class="lb-row ${r.me ? 'me' : ''} ${i === 0 ? 'top1' : ''}">
        <span class="pos">${i+1}º</span>
        ${r.me ? avatarHTML(38) : `<span class="av" style="background:${r.col}">${esc((r.n[0]||'?').toUpperCase())}</span>`}
        <span class="nm">${esc(r.n)}${r.me ? ' <span class="chip" style="background:var(--p1);color:#fff;font-size:9px;padding:2px 7px">você</span>' : ''}</span>
        <span class="xp">${icon('zap',14)} ${r.xp}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ---------- PERFIL ---------- */
function viewProfile(){
  const li = levelInfo(S.xp);
  const cats = ['Padrões','Sequências','Classificação','Dedução','Ordenação','Lógica','Enigmas','Revisão']
    .filter(c => S.stats[c] && S.stats[c].t > 0);
  const totalHits = cats.reduce((s, c) => s + S.stats[c].c, 0);
  const totalAns = cats.reduce((s, c) => s + S.stats[c].t, 0);
  const acc = totalAns ? Math.round(totalHits/totalAns*100) : 0;
  const doneByDiff = DIFFS.map(dd => {
    const pool = LESSONS.filter(l => l.d === dd.n);
    return { ...dd, done: pool.filter(l => S.progress[l.id]).length, total: pool.length };
  });
  return `
  <div class="view-enter">
    <div class="card prof-head">
      <button class="gear-btn" id="pSettings" title="Configurações" aria-label="Configurações">${icon('gear',20)}</button>
      <div class="avatar-edit">
        ${avatarHTML(96)}
        <button class="avatar-cam" id="pAvatar" title="Trocar foto de perfil">${icon('camera',14)}</button>
      </div>
      <div style="flex:1;min-width:200px">
        <h2>${esc(S.name || 'Explorador')}
          <button id="pEdit" style="width:32px;height:32px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:var(--faint)" aria-label="Editar nome">${icon('pencil',14)}</button>
        </h2>
        <p class="sub">Nível ${li.level} · ${li.rest}/${li.need} XP para o próximo</p>
        <div class="progress-line"><div class="progress"><i style="width:${Math.round(li.rest/li.need*100)}%; background:var(--y1)"></i></div><b>${Math.round(li.rest/li.need*100)}%</b></div>
      </div>
    </div>
    <div class="card panel">
      <h3 style="margin-bottom:2px">Estatísticas</h3>
      <div class="stat-grid">
        <div class="stat-box bb"><div class="v">${S.xp}</div><div class="k">XP total</div></div>
        <div class="stat-box rb"><div class="v">${S.streak}</div><div class="k">Sequência atual</div></div>
        <div class="stat-box yb"><div class="v">${S.bestStreak}</div><div class="k">Maior sequência</div></div>
        <div class="stat-box"><div class="v">${doneCount()}/${LESSONS.length}</div><div class="k">Lições</div></div>
        <div class="stat-box pb"><div class="v">${acc}%</div><div class="k">Precisão geral</div></div>
        <div class="stat-box"><div class="v">${todayXP()}/${GOAL}</div><div class="k">Meta de hoje</div></div>
      </div>
    </div>
    <h2 class="sec-title">Progresso por dificuldade</h2>
    <div class="card panel">
      ${doneByDiff.map(dd => `<div class="meter"><b style="color:${dd.col}">${dd.name}</b><span>${dd.done}/${dd.total}</span><div class="progress"><i style="width:${Math.round(dd.done/dd.total*100)}%; background:${dd.col}"></i></div></div>`).join('')}
    </div>
    <h2 class="sec-title">Últimos 7 dias</h2>
    <div class="card panel">
      ${weekHTML(42)}
      <div class="p-sub" style="margin-top:12px">Cada círculo roxo é um dia em que você treinou. Mantenha a fileira cheia!</div>
    </div>
    <h2 class="sec-title">Progresso por categoria</h2>
    <div class="card panel">
      ${cats.length ? cats.map(c => {
        const st = S.stats[c], pct = Math.round(st.c/st.t*100);
        return `<div class="meter"><b>${c}</b><span>${pct}%</span><div class="progress"><i style="width:${pct}%"></i></div></div>`;
      }).join('') : '<p class="sub">Responda alguns exercícios para ver seus domínios aqui.</p>'}
    </div>
    <h2 class="sec-title">Conquistas (${S.achievements.length}/${ACHIEVEMENTS.length})</h2>
    <div class="ach-grid">
      ${ACHIEVEMENTS.map(a => {
        const has = S.achievements.includes(a.id);
        return `<div class="ach ${has ? '' : 'locked'}"><div class="aic">${icon(a.ico,20)}</div><div><b>${a.name}</b><span>${a.desc}</span></div></div>`;
      }).join('')}
    </div>
  </div>`;
}
function bindProfile(){
  $('#pSettings').onclick = openSettings;
  $('#pAvatar').onclick = () => $('#avatarFile').click();
  $('#pEdit').onclick = () => {
    const m = openModal(`
      <h2>Seu perfil</h2>
      <div class="scene-center">
        <div class="avatar-edit">
          ${avatarHTML(84)}
          <button class="avatar-cam" id="mAvatar" title="Trocar foto de perfil">${icon('camera',13)}</button>
        </div>
      </div>
      <button class="btn ghost" id="mPick">${icon('camera',15)} ${S.avatar ? 'Trocar foto' : 'Adicionar foto'}</button>
      ${S.avatar ? `<button class="btn ghost" id="mDel">${icon('trash',15)} Remover foto</button>` : ''}
      <p style="margin-top:18px">Como você quer aparecer no ranking?</p>
      <input type="text" id="nameIn" maxlength="24" value="${esc(S.name)}" placeholder="Seu nome">
      <button class="btn purple" id="nameOk">Salvar</button>`);
    const inp = m.querySelector('#nameIn');
    const pick = () => $('#avatarFile').click();
    m.querySelector('#mAvatar').onclick = pick;
    m.querySelector('#mPick').onclick = pick;
    const del = m.querySelector('#mDel');
    if (del) del.onclick = () => {
      S.avatar = ''; save(); closeModal(); render();
      toast('Foto removida', 'trash');
    };
    const saveName = () => {
      S.name = inp.value.trim().slice(0,24) || 'Explorador';
      save(); closeModal(); render();
      toast('Perfil atualizado!', 'check');
    };
    m.querySelector('#nameOk').onclick = saveName;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); });
  };
}

/* ================================================================
   ROTEADOR SPA
   ================================================================ */
function go(view){
  if ((S.view === 'lesson' || S.view === 'flash') && view !== S.view){
    stopFlashTimer();
    run = null;
  }
  S.view = view; save(); render();
  window.scrollTo({ top:0, behavior:'smooth' });
}
function render(){
  const app = $('#app');
  hideSheet();
  if (S.view !== 'flash'){
    switch (S.view){
      case 'learn':      app.innerHTML = viewLearn(); bindLearn(); break;
      case 'challenges': app.innerHTML = viewChallenges(); bindChallenges(); break;
      case 'ranking':    app.innerHTML = viewRanking(); break;
      case 'profile':    app.innerHTML = viewProfile(); bindProfile(); break;
      case 'lesson':
        if (run){ renderRunScreen(); }
        else { S.view = 'learn'; app.innerHTML = viewLearn(); bindLearn(); }
        break;
      default:           app.innerHTML = viewHome(); bindHome();
    }
  }
  renderNav();
  renderTop();
}
let lastW = innerWidth;
addEventListener('resize', () => {
  if (Math.abs(innerWidth - lastW) > 80){
    lastW = innerWidth;
    if (S.view === 'learn' || S.view === 'home') render();
  }
});

/* ================================================================
   INICIALIZAÇÃO
   ================================================================ */
load();
regenHearts();
 $('#avatarFile').addEventListener('change', e => {
  setAvatarFromFile(e.target.files[0]);
  e.target.value = '';
});
 $('#importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if (typeof data.xp !== 'number' || typeof data.progress !== 'object') throw new Error('inválido');
      S = Object.assign(deepClone(DEFAULT_STATE), data);
      S.settings = Object.assign({ sound:true, fx:true }, S.settings || {});
      S.flags = Object.assign({ perfect:false }, S.flags || {});
      delete S.diff;
      save(); render();
      confetti(80);
      toast('Progresso importado com sucesso!', 'check', true);
    }catch(err){
      toast('Arquivo de backup inválido', 'x');
    }
  };
  r.readAsText(f);
});

/* Relógio dos corações */
setInterval(() => {
  const before = S.hearts;
  regenHearts();
  if (S.hearts > before){ renderTop(); toast('Um coração voltou!', 'heart'); }
  const nhText = $('#modal-root #nhText');
  if (nhText){
    const mins = Math.max(1, Math.ceil((S.heartsAt + HEART_MS - Date.now()) / 60000));
    nhText.innerHTML = `Você precisa de pelo menos 1 coração para jogar. O próximo coração volta em <b>~${mins} min</b> — ou encha todos agora.`;
  }
}, 30000);

if (S.view === 'lesson' || S.view === 'flash') S.view = 'home';
render();

if (!storeGet(KEY + '_onb')){
  const m = openModal(`
    <div class="scene-center">${booScene('boasVindas')}</div>
    <h2 style="text-align:center">Olá! Eu sou o Wazyboo</h2>
    <p style="text-align:center">Antes de começar, escolha o fundo que você prefere — sua escolha fica salva.</p>
    <div id="onbTheme">${themeChooseHTML()}</div>
    <p style="margin-top:18px">Agora me diga: como devo te chamar?</p>
    <input type="text" id="onbName" maxlength="24" placeholder="Seu nome (ou apelido)">
    <button class="btn purple" id="onbGo">${icon('sparkle',16)} Começar a treinar</button>`, false);
  bindThemeChoose('#onbTheme');
  const inp = m.querySelector('#onbName'); setTimeout(() => inp.focus(), 300);
  const done = () => {
    S.name = inp.value.trim().slice(0,24) || 'Explorador';
    save();
    storeSet(KEY + '_onb', '1');
    closeModal(); renderTop(); render();
    confetti(100);
    toast('Bem-vindo(a), ' + S.name + '!', 'sparkle', true);
  };
  m.querySelector('#onbGo').onclick = done;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(); });
}
</script>
</body>
</html>
